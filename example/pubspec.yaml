name: openmls_example
description: Interactive demo of the openmls package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  openmls:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The integration tests under integration_test/: the package inside this
  # app, on each platform (`make test-example`, `make test-example-web`).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # For the tests to make the references RFC 9420 §5.2 defines, a key
  # package's and a proposal's, the way the engine does: it takes them to
  # delete and to withdraw, and the tests check the one it returns with a
  # proposal against their own. The package itself depends on it.
  crypto: ^3.0.7
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
