# cargo-audit configuration.
#
# The ignore list is empty, and that is the finding rather than an oversight.
#
# Every entry it used to hold was a libcrux advisory that openmls-v0.8.1 pinned
# us to by exact version: RUSTSEC-2026-0073, -0075, -0124, -0207, -0208, -0209,
# -0211 and -0212. Each note ended with some form of "clears on the next
# upstream OpenMLS bump", and openmls-v0.9.0 is that bump — it moves the whole
# libcrux tree (libcrux-secrets 0.0.5 -> 0.0.6, libcrux-ed25519 0.0.6 -> 0.0.9,
# libcrux-aead 0.0.7 -> 0.0.9, hpke-rs 0.6.1 -> 0.7.0), so none of those
# advisories matches a crate in the graph any more. Verified by removing them
# and re-running: `make rust-audit` reports no vulnerabilities, and
# `make rust-deny` reports no `advisory-not-detected` warnings.
#
# RUSTSEC-2026-0212 is worth naming specifically, because it was the one entry
# that was NOT argued unreachable: it was an explicitly accepted
# availability-only risk on the aarch64 X-Wing path. It is now remediated
# outright rather than accepted.
#
# Add an entry back only with an inline justification, the way the removed ones
# carried theirs. `deny.toml` keeps its own list for the unmaintained-crate
# advisories that `cargo audit` does not fail on.

[advisories]
ignore = []
