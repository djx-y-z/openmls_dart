name: Setup the app under test
description: >-
  Flutter, and the app the integration tests run in: the example, or for a
  published version a new app that depends on it. Says which library the run
  has to end up testing, in VERIFY_LIBRARY, for `make verify-example-library`.

inputs:
  library:
    description: >-
      Where the app gets the package and its native library: tree, release or
      pub. See integration-reusable.yml.
    required: true
  package-version:
    description: The version on pub.dev, for library=pub.
    required: false
    default: ''
  flutter-version:
    description: >-
      A Flutter version other than the pinned one, for library=pub. Only the new
      app gets it: this repository's own tooling stays on the pin.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Make
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-make

    - name: Setup FVM and Flutter
      uses: ./.github/actions/setup-fvm

    - name: Get dependencies
      run: make get
      shell: bash

    - name: Resolve the example
      if: inputs.library != 'pub'
      run: make get ARGS="--directory=example"
      shell: bash

    # pub.dev serves a new version a little after accepting it, and the job that
    # gets here runs straight after the upload. `pub` resolves against the
    # package's version listing, which pub.dev's CDN keeps for up to two minutes
    # (`cache-control: public, max-age=120`), while the version's own page
    # answers as soon as the version exists: a wait on that page passed, and
    # `pub add` then failed with "doesn't match any versions" a minute and more
    # later. So the wait reads the listing, asked for the way pub asks for it.
    - name: Wait for the version on pub.dev
      if: inputs.library == 'pub'
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        set -uo pipefail
        url="https://pub.dev/api/packages/openmls"
        for _ in $(seq 1 40); do
          if curl -fsS --compressed -H 'Accept: application/vnd.pub.v2+json' "$url" \
            | grep -qF "\"version\":\"$PACKAGE_VERSION\""; then
            exit 0
          fi
          echo "Not in pub.dev's version listing yet; waiting."
          sleep 15
        done
        echo "::error::openmls $PACKAGE_VERSION did not appear in pub.dev's version listing in ten minutes."
        exit 1
      shell: bash

    # Each CDN node keeps its own copy of the listing, so the node `pub` reaches
    # can still hold the old one after the node the wait reached has the new.
    # That one message is tried again, for longer than the cache lasts; any
    # other failure stops the step at once.
    - name: Create a new app that uses the published package
      if: inputs.library == 'pub'
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        set -uo pipefail
        log=$(mktemp)
        for attempt in 1 2 3 4 5 6; do
          if make create-consumer VERSION="$PACKAGE_VERSION" FLUTTER_VERSION="$FLUTTER_VERSION" 2>&1 | tee "$log"; then
            echo "EXAMPLE_DIR=build/consumer" >> "$GITHUB_ENV"
            exit 0
          fi
          grep -qF "doesn't match any versions" "$log" || exit 1
          [ "$attempt" -lt 6 ] || break
          echo "::notice::pub cannot resolve openmls $PACKAGE_VERSION yet (attempt $attempt of 6); trying again in 30 seconds."
          sleep 30
        done
        echo "::error::pub could not resolve openmls $PACKAGE_VERSION in six attempts."
        exit 1
      shell: bash

    - name: Say which library this run has to test
      env:
        LIBRARY: ${{ inputs.library }}
      run: |
        case "$LIBRARY" in
          tree) echo "VERIFY_LIBRARY=--built" >> "$GITHUB_ENV" ;;
          release|pub) echo "VERIFY_LIBRARY=--released" >> "$GITHUB_ENV" ;;
          *) echo "::error::Unknown library: $LIBRARY"; exit 1 ;;
        esac
      shell: bash
