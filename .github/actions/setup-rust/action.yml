name: Setup Rust
description: Setup Rust toolchain with optional cross-compilation targets

inputs:
  toolchain:
    description: 'Rust toolchain to install (e.g. stable, 1.89). Defaults to stable.'
    required: false
    default: 'stable'
  targets:
    description: 'Comma-separated list of Rust targets to install (e.g., aarch64-apple-darwin,x86_64-apple-darwin)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      # SHA-pinned; the tag normally selects the toolchain, so it is passed
      # explicitly via the `toolchain` input instead.
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        # clippy is needed by `make rust-clippy` (the test job's lint step).
        # dtolnay/rust-toolchain installs the minimal profile, which omits it.
        components: clippy

    - name: Add cargo bin to PATH (Unix)
      if: runner.os != 'Windows'
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Add cargo bin to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    # Use Strawberry Perl for OpenSSL build (MSYS2 Perl from Git Bash is incompatible)
    - name: Configure Perl for OpenSSL (Windows)
      if: runner.os == 'Windows'
      run: echo "PERL=C:\Strawberry\perl\bin\perl.exe" >> "$GITHUB_ENV"
      shell: bash

    # Cache compiled Rust dependencies, and the tools `cargo install` puts in
    # ~/.cargo/bin. Dramatically speeds up Windows builds where vendored
    # OpenSSL takes ~10 min.
    #
    # rust-cache keys on the OS family ("Linux"), the rustc version and the
    # lockfile, not on the runner image, so a job moved to a new image restores
    # what the old one compiled: C objects from its compiler, tools linked
    # against its glibc. Measured on the move to ubuntu-26.04: every Ubuntu job
    # here restored its 24.04 cache in full, the Linux test legs compiled
    # nothing but this crate, and wasm-pack and cargo-ndk were the 24.04
    # builds, so the new compiler would have met the C code first on whichever
    # commit next changed the lockfile or rustc. `ImageOS` names the image
    # family (ubuntu24, ubuntu26, macos15, win25, ...), so naming it here
    # starts a cold cache with the move instead.
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: "rust -> target"
        cache-on-failure: true
        env-vars: ImageOS
