# Run tests on multiple platforms
#
# Triggers:
# - Manual dispatch (workflow_dispatch)
# - Push to main branch (relevant files)
# - Pull requests (relevant files) - skipped for native-version update PRs
# - After successful build-openmls workflow
#
# The path filters carry THIRD_PARTY_NOTICES.txt and .gitattributes because
# `make verify-third-party-notices` runs here: the notices file is the artefact
# being checked, and .gitattributes decides which bytes a checkout materialises
# for it. Without them the one commit that can break — or fix — that check is
# also the one commit that does not run it, so a stale inventory reaches main
# unverified and only surfaces in the release preflight of both stages.
#
# They carry all of .github/** for the same reason, one level up: this workflow
# and the composite actions it calls are themselves only exercised here. Listing
# just this file and test-reusable.yml left the actions unwatched, so a change to
# setup-fvm or setup-rust could not be validated before merge — and a
# pull_request run resolves them from the merge ref, so the PR's own versions are
# what execute. The release-only workflows (publish, build-openmls) are in scope
# too: they run once, at a moment when a failure is expensive.
#
# The same filter has to be on push, not just pull_request: a PR run can read the
# base branch's cache scope but never the reverse, so a CI change that lands
# without a main-branch run leaves every later PR starting from a cold cache.
#
# Platforms: Linux x86_64, Linux ARM64, macOS ARM64, Windows x86_64

name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'hook/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitattributes'
      - '.github/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'hook/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitattributes'
      - '.github/**'
  workflow_run:
    workflows: ["Build openmls FRB Libraries"]
    types:
      - completed

# Least-privilege default. The reusable test workflow declares its own
# contents: read; the coverage-badge job authenticates with GIST_TOKEN (a PAT),
# not GITHUB_TOKEN, so no write scope is needed here.
permissions:
  contents: read

jobs:
  test:
    # Skip tests for:
    # - Failed workflow_run triggers
    # - openmls update PRs, which move native_version ahead of the binaries
    #
    # The second condition used to skip every PR opened by a bot, which also
    # silenced Dependabot's action bumps and the template update PRs — precisely
    # the PRs that change CI and so most need to be exercised before merge.
    # Matching the branch prefix instead narrows the skip to the PRs
    # check-openmls-updates.yml opens for itself (`update-openmls-<version>`).
    # head_ref is empty outside pull_request, so push, workflow_dispatch and
    # workflow_run runs are unaffected.
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      !startsWith(github.head_ref, 'update-openmls-')
    uses: ./.github/workflows/test-reusable.yml
    with:
      run-coverage: true
      update-badge: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
