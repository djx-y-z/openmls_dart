# Run tests on multiple platforms
#
# Triggers:
# - Manual dispatch (workflow_dispatch)
# - Push to main branch (relevant files)
# - Pull requests (relevant files) - skipped for native-version update PRs
# - After successful build-openmls workflow
#
# The path filters carry THIRD_PARTY_NOTICES.txt and .gitattributes because
# `make verify-third-party-notices` runs here: the notices file is the artefact
# being checked, and .gitattributes decides which bytes a checkout materialises
# for it. .copier-answers.yml is there for the same reason one gate later —
# `make verify-frb-pins` reads `frb_version` from it, and a commit that edits
# only that file is exactly the commit that can put the pins out of step.
# Without them the one commit that can break — or fix — that check is
# also the one commit that does not run it, so a stale inventory reaches main
# unverified and only surfaces in the release preflight of both stages.
#
# They carry all of .github/** for the same reason, one level up: this workflow
# and the composite actions it calls are themselves only exercised here. Listing
# just this file and test-reusable.yml left the actions unwatched, so a change to
# setup-fvm or setup-rust could not be validated before merge — and a
# pull_request run resolves them from the merge ref, so the PR's own versions are
# what execute. The release-only workflows (publish, build-openmls) are in scope
# too: they run once, at a moment when a failure is expensive.
#
# The same filter has to be on push, not just pull_request: a PR run can read the
# base branch's cache scope but never the reverse, so a CI change that lands
# without a main-branch run leaves every later PR starting from a cold cache.
#
# Platforms: Linux x86_64, Linux ARM64, macOS ARM64, Windows x86_64

name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'hook/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pubspec.yaml'
      # The doc gate lives in this file: without it `make doc` stops promoting
      # unresolved references to errors and the CI step passes silently.
      - 'dartdoc_options.yaml'
      # Same reasoning one gate over: this file decides what `make analyze`
      # reports, so a commit that changes only the lint configuration is
      # precisely the one that must re-run it.
      - 'analysis_options.yaml'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitattributes'
      - '.copier-answers.yml'
      - '.github/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'hook/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pubspec.yaml'
      # The doc gate lives in this file: without it `make doc` stops promoting
      # unresolved references to errors and the CI step passes silently.
      - 'dartdoc_options.yaml'
      # Same reasoning one gate over: this file decides what `make analyze`
      # reports, so a commit that changes only the lint configuration is
      # precisely the one that must re-run it.
      - 'analysis_options.yaml'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitattributes'
      - '.copier-answers.yml'
      - '.github/**'
  workflow_run:
    workflows: ["Build openmls FRB Libraries"]
    types:
      - completed

# Least-privilege default. The reusable test workflow declares its own
# contents: read; the coverage-badge job authenticates with GIST_TOKEN (a PAT),
# not GITHUB_TOKEN, so no write scope is needed here.
permissions:
  contents: read

jobs:
  test:
    # Only a failed workflow_run trigger is skipped.
    #
    # `update-openmls-*` branches used to be skipped as well, on the grounds
    # that they move the openmls version ahead of the published
    # `openmls_frb` binary. That was the more dangerous half of the trade: the
    # dependency bump — the one pull request whose entire payload is new native
    # code — became the only one merged without the suite ever running against
    # it on any platform.
    #
    # What closes it is already in the reusable workflow: `make build` runs
    # before `make test`, and the build hook checks `rust/target/release` first,
    # returning without downloading anything when a local build is there
    # (`hook/build.dart`). `.dart_tool` is cached nowhere, so on a fresh runner
    # the first hook run happens during `make test`, after that build — which is
    # exactly the procedure that used to be carried out by hand before merging
    # one of these pull requests.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/test-reusable.yml
    with:
      run-coverage: true
      update-badge: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
