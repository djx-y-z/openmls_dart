# Fuzzing workflow (cargo-fuzz + libFuzzer)
#
# - Pull requests touching rust/**: a short smoke run per target catches
#   regressions that make a parser panic on malformed input.
# - Weekly schedule: a longer run per target for deeper exploration.
# - Manual dispatch: choose the per-target duration.
#
# Targets are discovered from the `[[bin]]` entries in rust/fuzz/Cargo.toml and
# fanned out into a matrix, one job per target. Adding a fuzz target therefore
# needs no change to this workflow, and `fail-fast: false` means a crash in one
# target still lets every other target finish — running them sequentially in a
# single job would stop at the first crash and silently skip the rest.
#
# Any crash is uploaded as a per-target artifact (the reproducing input) so it
# can be replayed locally with `cargo +nightly fuzz run <target> <artifact>`.

name: Fuzz

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Mondays 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to run each fuzz target'
        type: string
        default: '300'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover fuzz targets
    runs-on: ubuntu-26.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz derives its target list from the `[[bin]]` entries of
      # rust/fuzz/Cargo.toml, so reading them here is equivalent to
      # `cargo fuzz list` while needing neither a Rust toolchain nor a build —
      # which keeps this job to a few seconds.
      - name: List fuzz targets
        id: list
        run: |
          targets=$(awk '
            /^\[\[bin\]\]/ { inbin = 1; next }
            /^\[/          { inbin = 0 }
            inbin && match($0, /^name[[:space:]]*=[[:space:]]*"[^"]+"/) {
              s = substr($0, RSTART, RLENGTH)
              sub(/^[^"]*"/, "", s)
              sub(/"$/, "", s)
              print s
            }
          ' rust/fuzz/Cargo.toml | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Discovered fuzz targets: $targets"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: discover
    # An empty list is a valid state (every target deleted); GitHub errors on an
    # empty matrix, so skip the fan-out instead of failing the workflow.
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup nightly Rust
        # SHA-pinned; the tag normally selects the toolchain, so it is passed
        # explicitly via the `toolchain` input instead.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust -> target
            rust/fuzz -> target
          cache-on-failure: true
          # The runner image belongs in the key: see the same step in
          # .github/actions/setup-rust/action.yml.
          env-vars: ImageOS

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Duration per target: short smoke on PRs, longer on schedule/dispatch.
      - name: Determine run duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          DURATION_INPUT: ${{ github.event.inputs.duration }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Validate the dispatch input: digits only, so it can never inject
            # shell text (it flows into the fuzz command below).
            case "$DURATION_INPUT" in
              ''|*[!0-9]*)
                echo "::error::duration must be a positive integer (got '$DURATION_INPUT')"
                exit 1
                ;;
            esac
            echo "seconds=$DURATION_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=600" >> "$GITHUB_OUTPUT"
          fi

      # Seeds give libFuzzer structurally-correct starting inputs; tolerate a
      # deleted generator so projects can opt out by removing the file. A
      # generator that does not build fails the job: that is code nobody
      # compiled. One that builds and then fails leaves a warning and whatever
      # it wrote: a seed is a head start, never a requirement, and the fuzzing
      # below matters more. The fuzz crate gets the crate's own lock file
      # before it is built, here and in `make fuzz-seed`.
      - name: Generate seed corpus
        timeout-minutes: 45
        run: |
          if [ -f rust/fuzz/examples/gen_corpus.rs ]; then
            cp rust/Cargo.lock rust/fuzz/Cargo.lock
            (cd rust/fuzz && cargo build --release --example gen_corpus)
            make fuzz-seed || echo "::warning::The seed generator failed; fuzzing from the seeds it wrote, if any"
          else
            echo "No rust/fuzz/examples/gen_corpus.rs — running with an empty corpus"
          fi

      - name: Run fuzz target
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_TOTAL: ${{ steps.duration.outputs.seconds }}
        run: |
          # The fuzz crate resolves against the crate's own lock file, so the
          # parsers fuzzed here are the versions that ship. It is not a member
          # of the crate's workspace and keeps no lock of its own.
          cp rust/Cargo.lock rust/fuzz/Cargo.lock
          cd rust
          # -timeout gives libFuzzer a per-input watchdog so a single hanging
          # input is aborted and reported rather than running until the job's
          # hard timeout (-max_total_time only bounds the loop between inputs).
          # `timeout` bounds the whole step, the build included: a dispatched
          # run sets its own duration, which no fixed timeout-minutes could
          # follow, and a hang outside an input is otherwise held for GitHub's
          # six hours.
          timeout --kill-after=60 "$((SECONDS_TOTAL + 3600))" \
            cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time="$SECONDS_TOTAL" \
            -timeout=30 \
            -rss_limit_mb=4096

      # If libFuzzer found a crash it writes the reproducer here and the run
      # fails; capture it so the exact input can be replayed.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: rust/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
