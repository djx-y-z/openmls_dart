# Check for new copier template versions and open an update PR
#
# This workflow:
# 1. Runs daily (or manually) to check for new template releases
# 2. Compares with the current template version in .copier-answers.yml
# 3. If a newer version is found:
#    - Applies it with `copier update` (make update-template)
#    - Reports anything copier could not merge, and whether the version bump
#      actually landed in .copier-answers.yml
#    - Writes a CHANGELOG entry with AI (provider per AI_MODELS)
#    - Runs the same gates the pre-commit hook runs
#    - Opens a PR — as a draft when it needs a human to finish it
#
# It used to only *notify*: it opened a PR whose body carried the changelog and
# manual instructions, and whose diff was empty by design. That worked only by
# accident. `create-pull-request` opens nothing when there is no diff, and the
# diff those PRs actually carried was `.fvmrc`, rewritten by `fvm install` on
# every run — noise, not payload. Once that drift was fixed in template v4.2.0
# the tree stayed clean and the notification would have gone silent while the
# job still reported success. Two things here come directly from that:
# the update now has a real payload, and the "PR was expected but none exists"
# case is an explicit failure instead of an absence nobody sees.

name: Check Template Updates

on:
  schedule:
    # Run daily at 10:00 UTC (1 hour after upstream check at 09:00)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Specific version to update to (leave empty for latest)'
        required: false
        default: ''
        type: string
      force_update:
        description: 'Regenerate even if an update PR is already open (force-pushes its branch)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: >-
          Report which superseded update pull requests would be closed, and
          close none. Defaults to ON for a manual run: this is the input a
          human reaches for to see what the rule does, and a rehearsal that
          closes somebody's pull request is not a rehearsal. Scheduled runs
          close for real.
        required: false
        default: true
        type: boolean

jobs:
  update-template:
    runs-on: ubuntu-latest
    # All writes (checkout push, PR creation, branch push) go through the App
    # token; the default GITHUB_TOKEN needs no write access here.
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Check for template updates
        id: check
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          # Quota, not access — the template repository is public. An
          # unauthenticated call is capped at 60/hour counted per *source IP*,
          # and hosted runners share theirs, so this step can be refused with a
          # 403 that reads like a permission problem, on a schedule nobody
          # controls. The job's own read-only token gives it a quota of its own.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Build arguments
          ARGS="--ci-output $GITHUB_OUTPUT"

          if [ -n "$TARGET_VERSION" ]; then
            # Manual input is interpolated into ARGS and reaches a shell before
            # the Dart checker can validate it. The template's own tags are
            # plain semver, optionally v-prefixed.
            if [[ ! "$TARGET_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::target_version must use the vX.Y.Z or X.Y.Z form."
              exit 2
            fi
            ARGS="$ARGS --version $TARGET_VERSION"
          fi

          echo "Running: make check-template-updates ARGS=\"$ARGS\""
          # `|| true` is unavoidable, and the exit code is unusable as a signal:
          # the checker exits 1 for "update available", and GNU make collapses any
          # non-zero recipe status into its own exit 2 (verified: a recipe exiting
          # 1 makes `make` exit 2), so 2 cannot be told apart from a crash.
          make check-template-updates ARGS="$ARGS" || true

          # What can tell them apart is the outputs file: the checker writes it
          # before signalling, and not at all when it throws. Without this gate a
          # broken checker looks exactly like "already up to date" and the workflow
          # stays green forever while silently never opening another update.
          if ! grep -q '^needs_update=' "$GITHUB_OUTPUT"; then
            echo "::error::Template update checker wrote no result — it failed before reporting. Check the step log above; do NOT read this as 'up to date'."
            exit 1
          fi

          echo "Check completed. Outputs:"
          cat "$GITHUB_OUTPUT" || true

      # Idempotency gate. It matters more here than for the dependency update:
      # a conflicted template update is finished by a human pushing commits to
      # this very branch, and regenerating would force-push over their work.
      # force_update is the only way past it.
      - name: Check for existing update PR
        id: existing
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          BRANCH="update-template-${LATEST_VERSION}"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" != "0" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open update PR for branch $BRANCH already exists — skipping to avoid force-pushing over it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned for the same reason the actions are pinned by SHA and fvm by
      # version: this runs unattended, and a copier release that changed how it
      # merges would show up as a conflict-shaped diff rather than a clean
      # failure. jinja2-strcase is a template dependency (_jinja_extensions).
      - name: Install copier
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'copier==9.11.1' 'jinja2-strcase==0.0.2'
          copier --version

      # Everything the update needs is read from .copier-answers.yml, so the
      # only argument is the version. The step never fails on a conflict: a
      # half-merged update is still worth a pull request, and what a reviewer
      # has to know travels in the outputs, not the exit code.
      #
      # Copier refuses to run against a dirty destination — untracked files
      # included — so this step is also where anything that modified the tree
      # earlier in the job surfaces, named, instead of as copier's own
      # "Destination repository is dirty".
      - name: Apply template update
        id: update
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        # Every key is step-scoped, as the single token before them was. These
        # may be org-level secrets shared by unrelated repositories, and a
        # job-level `env:` would hand each of them to every other step in this
        # job — including the ones that run third-party actions.
        #
        # AI_MODELS is a variable, not a secret: which model writes the entry
        # is operational configuration, and keeping it out of the code is what
        # makes a provider switch a settings change rather than a template
        # release rolled out across every generated project.
        env:
          AI_MODELS: ${{ vars.AI_MODELS }}
          AI_EFFORT: ${{ vars.AI_EFFORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          # `make update-template` re-reads the template CHANGELOG through the
          # same helper the check step uses, so it needs the same token for the
          # same reason — see the note there. Actions does not export
          # GITHUB_TOKEN to a step by itself, so without this line that call is
          # anonymous: same job, same runner IP, seconds later. It fails quietly
          # too — the changelog fetch is wrapped, so a 403 leaves the AI with no
          # template changelog to summarise and says so only in a warning.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make update-template ARGS="--version $LATEST_VERSION --ci-output $GITHUB_OUTPUT"

      # Without this, a conflicted update produces no pull request at all — the
      # one outcome this workflow exists to report. `create-pull-request` begins
      # with `git checkout -B <temp> HEAD`, and git refuses that while the index
      # holds unmerged entries: `error: you need to resolve your current index
      # first`. Its own `git add -A` comes later and is never reached. So the
      # run counted the conflicts, wrote the draft body naming them, and then
      # died on git before it could open anything — measured on a real update
      # that left `CLAUDE.md`, `CONTRIBUTING.md` and `README.md` unmerged.
      #
      # Staging them is what the draft is *for*: what copier left travels in the
      # commit, the pull request opens as a draft listing the files, and a human
      # resolves them on the branch. Only the unmerged paths are staged — what
      # else belongs in the commit is `create-pull-request`'s business, and
      # keeping this step to one job keeps its log readable. `-z`/`-0` because a
      # conflicted path may hold spaces or non-ASCII, and `-r` so an empty list
      # is a no-op: `has_conflicts` is also set by a marker found in a file git
      # considers merged, and that case has nothing to stage.
      #
      # The status letters are logged rather than the names alone, because
      # markers do not travel for every shape. Measured over all four git can
      # leave here: `UU` and `AA` stage the file with `<<<<<<<` in it, but `UD`
      # (we modified, the template deleted) stages our side and `DU` (we
      # deleted, the template modified) stages theirs — neither carries a
      # marker, one side silently wins, and the pull request then shows a clean
      # file while its own body lists that path as conflicted. The letters are
      # the only thing in the run that says which of the two happened.
      #
      # `sed` ends that pipeline on purpose. GitHub runs this with `bash -e`,
      # `grep` exits 1 when it matches nothing, and `has_conflicts` can be true
      # with no unmerged path at all — so with `grep` last the step would fail
      # in exactly the case the `-r` below exists to tolerate. Verified both
      # ways: `grep` last exits 1, `sed` last exits 0.
      - name: Stage conflicted files
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true' && steps.update.outputs.has_conflicts == 'true'
        run: |
          echo "Unmerged paths copier left behind (UU/AA carry markers, UD/DU do not):"
          git status --short --untracked-files=no | grep -E '^(U.|.U|AA|DD)' | sed 's/^/  /'
          git diff --name-only --diff-filter=U -z | xargs -0 -r git add --

      - name: Setup Rust
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-rust

      - name: Get Dart dependencies
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        run: make get

      # The same three checks the pre-commit hook runs, so the PR states up
      # front what a maintainer would otherwise find out by pulling the branch.
      # They are reported, never enforced: a template update that breaks a gate
      # is exactly the update a human most needs to see.
      #
      # They cannot stand in for the conflict report, either. All three read
      # only Dart and Rust, and conflicts are not confined to those: a single
      # real update left them in Makefile, pubspec.yaml, rust/Cargo.toml,
      # rust/src/frb_generated.rs and two Dart scripts. The ones in Makefile
      # and Markdown pass all three gates intact.
      #
      # A failing gate cannot fail this step, and must not: the pull request is
      # the whole point of the run, and losing it would trip the "no PR was
      # opened" check below with an error naming the wrong cause. That is what
      # the `if`/`fi` around each gate is for, not style — GitHub runs this with
      # `bash -e`, where a command in an `if` condition does not trigger the
      # exit, and the block itself returns the status of the `echo` (verified:
      # a script of `if false; then …; else …; fi` exits 0 under `bash -e`).
      # `continue-on-error` is deliberately absent, so a genuine failure — the
      # output write itself — still fails the step. Do not "fix" the `if`s into
      # bare commands.
      - name: Run quality gates
        id: gates
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          if make format-check; then echo "format=true" >> "$GITHUB_OUTPUT"; else echo "format=false" >> "$GITHUB_OUTPUT"; fi
          if make rust-check;   then echo "rust=true"   >> "$GITHUB_OUTPUT"; else echo "rust=false"   >> "$GITHUB_OUTPUT"; fi
          if make analyze ARGS="--fatal-infos"; then echo "analyze=true" >> "$GITHUB_OUTPUT"; else echo "analyze=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          # A draft when a human has to finish it. Conflicts can land in files
          # every gate above passes — Makefile and Markdown among them — so
          # nothing else would stop this branch being merged as-is.
          draft: ${{ steps.update.outputs.has_conflicts == 'true' || steps.update.outputs.commit_landed != 'true' }}
          commit-message: |
            chore: adopt copier template ${{ steps.check.outputs.current_version }} → ${{ steps.check.outputs.latest_version }}
          title: "Adopt copier template ${{ steps.check.outputs.current_version }} → ${{ steps.check.outputs.latest_version }}"
          body: |
            ## Automated Template Update

            `copier update` has been applied to this branch.

            | Component | Current | New |
            |-----------|---------|-----|
            | Template  | ${{ steps.check.outputs.current_version }} | ${{ steps.check.outputs.latest_version }} |

            ${{ steps.update.outputs.has_conflicts == 'true' && '> [!WARNING]' || '' }}
            ${{ steps.update.outputs.has_conflicts == 'true' && '> **Conflicts — this PR is a draft.** Copier could not merge the files below and left both sides in them. Do not rely on the gates above to catch this: conflicts can land in files none of them read, so the branch would otherwise look mergeable.' || '' }}

            ${{ steps.update.outputs.conflict_files }}

            ${{ steps.update.outputs.commit_landed != 'true' && '> [!CAUTION]' || '' }}
            ${{ steps.update.outputs.commit_landed != 'true' && '> **`_commit` did not land.** `.copier-answers.yml` still records the old version, so merging this leaves the project looking un-updated and every future run will re-open this same PR. Fix the file before merging.' || '' }}

            ### Checks

            | Check | Result |
            |-------|--------|
            | `_commit` bumped | ${{ steps.update.outputs.commit_landed == 'true' && 'yes' || '**NO**' }} |
            | Conflicts | ${{ steps.update.outputs.has_conflicts == 'true' && format('**{0}**', steps.update.outputs.conflict_count) || 'none' }} |
            | `make format-check` | ${{ steps.gates.outputs.format == 'true' && 'pass' || '**fail**' }} |
            | `make rust-check` | ${{ steps.gates.outputs.rust == 'true' && 'pass' || '**fail**' }} |
            | `make analyze --fatal-infos` | ${{ steps.gates.outputs.analyze == 'true' && 'pass' || '**fail**' }} |
            | CHANGELOG entry | ${{ steps.update.outputs.changelog_updated == 'true' && format('written by `{0}`', steps.update.outputs.ai_provider) || format('**not written** ({0})', steps.update.outputs.changelog_error) }} |

            ### Template changelog for this range

            ${{ steps.check.outputs.changelog }}

            ### Before merge

            1. **Review the CHANGELOG entry.** It is filed under `### For
               Contributors` → `#### Changed`, which is where template adoptions
               belong by default. Move it to `### For Users` if this release
               changes what the published package does at build or run time —
               that call is a human's, and the entry is written only from the
               diff that actually landed here.
            2. **Read the diff, not just the summary.** A template release
               describes changes for every project generated from it; parts of
               it can arrive as a no-op here.
            3. ${{ steps.update.outputs.has_conflicts == 'true' && '**Resolve the conflicts listed above**, then mark this PR ready for review.' || 'Check that nothing project-specific was overwritten.' }}

            ### Links

            - [Full comparison](${{ steps.check.outputs.compare_url }})
            - [Release notes](${{ steps.check.outputs.release_url }})

            ---
            *This PR was created automatically by the template update checker.*
          branch: update-template-${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: |
            template
            automated
            ${{ steps.update.outputs.has_conflicts == 'true' && 'conflicts' || '' }}
            ${{ steps.update.outputs.commit_landed != 'true' && 'commit-not-landed' || '' }}
            ${{ steps.update.outputs.changelog_updated != 'true' && 'changelog-needed' || '' }}

      # GitHub refuses to let an App write a file under `.github/workflows/`
      # unless the App holds the `Workflows` permission, and `create-pull-request`
      # relays that refusal exactly as GitHub words it: `Resource not accessible
      # by integration` on `POST /git/trees`, naming neither the file nor the
      # permission — and only *after* every blob has been created, which is
      # itself a `Contents: write` call and so reads like anything but a
      # permission problem. Template updates touch workflows regularly, and the
      # first one that does is the first time the gap can possibly show, so this
      # note costs a step and saves the investigation.
      - name: Explain a failed pull request
        if: failure() && steps.cpr.outcome == 'failure'
        run: |
          echo "::error::Could not open the pull request. If the error above is 'Resource not accessible by integration', the App behind APP_ID is missing 'Workflows: Read and write' — needed whenever an update touches .github/workflows/**. Two traps: 'Actions' is a different permission and does not cover this, and adding the permission does not reach the App's tokens until the installation accepts it (Settings -> Applications -> Installed GitHub Apps -> your app -> Review request)."

      # The check this workflow did not have, and the reason it went unnoticed
      # that it had stopped working. `create-pull-request` opens nothing when
      # there is no diff and exits successfully, so "an update was found but no
      # PR exists" used to be indistinguishable from a healthy run — visible
      # only as the absence of something nobody was watching for.
      - name: Verify a PR was opened
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          COMMIT_LANDED: ${{ steps.update.outputs.commit_landed }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::An update was available but no pull request was created — create-pull-request found no diff to commit. Do NOT read this run as 'nothing to do'."
            exit 1
          fi
          echo "::notice::Opened PR #${PR_NUMBER}."

          # Failed after the PR exists, on purpose: the applied update is worth
          # keeping, and this state has to be loud because it is the one that
          # repeats forever if ignored.
          if [ "$COMMIT_LANDED" != "true" ]; then
            echo "::error::copier did not bump _commit in .copier-answers.yml. PR #${PR_NUMBER} must be fixed before merge, or this update will be re-opened on every run."
            exit 1
          fi

      # Close the update pull requests this run supersedes.
      #
      # `copier update` runs from the `_commit` recorded on the default branch
      # to the version it is given, so the branch this run produced contains
      # everything an older open one did. Left alone they accumulate: six
      # `update-template-*` pull requests have been opened here and every single
      # one was closed by hand, never merged — which is the case for automating
      # it and also the reason to be careful, because the hand that closed them
      # was reading each one.
      #
      # Deliberately ORTHOGONAL to the idempotency gate above. That one asks
      # "does a pull request for THIS version already exist" and is keyed on the
      # branch name; this one asks "which OLDER ones are now pointless". They
      # never decide the same pull request, so neither can mask the other.
      #
      # Four vetoes, and every one of them fails toward leaving the pull request
      # open. The gate that matters most is the last: a pull request whose
      # conflicts a human has resolved is exactly the one whose work would be
      # thrown away, and a template update conflicts more often than not — five
      # of the six carried the `conflicts` label.
      #
      #   1. the branch is not `update-template-v<x>.<y>.<z>`, or its version is
      #      not strictly older than this run's — not this job's business;
      #   2. it carries the `agent-repaired` label;
      #   3. one of its commits carries a `repair-build:` trailer;
      #   4. any commit on it has an author that is not a bot.
      #
      # 2 and 3 are the contract `repair-build.yml` writes down in two places
      # (search it for "auto-close"): the repair commits with the App token, so
      # its commits ARE the bot's and "every commit here is the bot's" stays
      # true on a branch an agent has worked on. The label and the trailer are
      # what can tell the difference, and an agent-repaired branch carries
      # reasoning nobody has confirmed — it is precisely the one that must not
      # close itself.
      #
      # ⚠ The trailer is in the COMMIT MESSAGE, not in the pull request body,
      # and the difference is not academic. These pull request bodies embed the
      # CHANGELOG entry, and a CHANGELOG entry in this project has quoted the
      # string `repair-build: <sha> (agent)` while describing this very feature
      # — so a body search matches a pull request that was never repaired.
      # Measured: it false-positives on the real one that prompted this.
      #
      # Closing is reversible — `gh pr reopen` — which is why the vetoes are
      # about not discarding *unconfirmed work* rather than about the close
      # itself. The branch is untouched either way.
      #
      # The `if:` carries an implicit `success()`, which is load-bearing and
      # invisible: a run where the step above found that no pull request was
      # opened has already failed, so this one does not run and cannot close
      # anything against a reference version that produced nothing.
      - name: Close superseded template update pull requests
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REFERENCE: ${{ steps.check.outputs.latest_version }}
          # Null on a schedule, so a scheduled run closes for real; true by
          # default on the manual path. See the input's description.
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          gh pr list --repo "$GH_REPO" --state open --limit 100 \
            --json number,headRefName,labels > "$RUNNER_TEMP/open-prs.json"

          # The decision and the act are separate on purpose. Everything below
          # this heredoc reads a file; everything inside it only reads GitHub.
          # That is what makes the rule testable against real pull requests
          # without any of them being closed to find out.
          python3 - "$REFERENCE" "$RUNNER_TEMP/open-prs.json" "$RUNNER_TEMP/supersede.json" <<'PY'
          import json, os, re, subprocess, sys

          REFERENCE, PR_LIST, OUT = sys.argv[1], sys.argv[2], sys.argv[3]

          BRANCH = re.compile(r'^update-template-v(\d+)\.(\d+)\.(\d+)$')
          VERSION = re.compile(r'^v?(\d+)\.(\d+)\.(\d+)$')
          # Anchored to the start of a line and matched against the commit
          # message body, which is where `repair-build.yml` writes it. A loose
          # substring search matches prose quoting the trailer.
          TRAILER = re.compile(
              r'^repair-build: [0-9a-f]{7,40} \((?:agent|regenerate)\)\s*$', re.M)

          def bail(reason):
              print(f"closing nothing: {reason}")
              json.dump({'reference': REFERENCE, 'close': [], 'kept': []},
                        open(OUT, 'w'), indent=2)
              raise SystemExit(0)

          ref = VERSION.match(REFERENCE.strip())
          if not ref:
              bail(f"the reference version {REFERENCE!r} is not a plain vX.Y.Z")
          reference = tuple(int(g) for g in ref.groups())

          close, kept = [], []
          for pr in json.load(open(PR_LIST)):
              branch = pr.get('headRefName') or ''
              match = BRANCH.match(branch)
              if not match:
                  continue
              if tuple(int(g) for g in match.groups()) >= reference:
                  continue

              entry = {'number': pr['number'], 'branch': branch}
              def keep(why):
                  kept.append(dict(entry, why=why))

              if 'agent-repaired' in {l.get('name') for l in (pr.get('labels') or [])}:
                  keep('it carries the `agent-repaired` label')
                  continue

              # Read per pull request rather than in the listing above: `gh pr
              # list` does not carry commits, and this is the one field the
              # decision cannot be made without.
              try:
                  commits = json.loads(subprocess.run(
                      ['gh', 'pr', 'view', str(pr['number']),
                       '--repo', os.environ['GH_REPO'], '--json', 'commits'],
                      capture_output=True, text=True, check=True).stdout)['commits']
              except Exception as exc:
                  keep(f'its commits could not be read ({exc})')
                  continue

              if not commits:
                  keep('it reports no commits at all')
                  continue

              if any(TRAILER.search(c.get('messageBody') or '') for c in commits):
                  keep('a commit on it carries a `repair-build:` trailer')
                  continue

              # An author with no login is not a bot either. GitHub reports one
              # for a commit whose email matches no account, which is a human
              # who pushed from a machine git was configured on differently.
              authors = [a for c in commits for a in (c.get('authors') or [])]
              humans = sorted({(a.get('login') or a.get('name') or 'an unnamed author')
                               for a in authors
                               if not (a.get('login') or '').endswith('[bot]')})
              if humans or not authors:
                  keep('it carries commits by ' + (', '.join(f'`{h}`' for h in humans)
                                                   or 'nobody this can identify'))
                  continue

              close.append(entry)

          json.dump({'reference': REFERENCE, 'close': close, 'kept': kept},
                    open(OUT, 'w'), indent=2)
          print(f"{len(close)} superseded by {REFERENCE}, {len(kept)} held back")
          PY

          {
            echo "## Superseded update pull requests"
            echo
            jq -r '
              (if (.close | length) == 0
                 then "Nothing older than `" + .reference + "` is open."
                 else "Superseded by `" + .reference + "`:\n\n"
                      + (.close | map("- #" + (.number|tostring) + " (`" + .branch + "`)") | join("\n"))
               end),
              (if (.kept | length) == 0 then empty
                 else "\nLeft open:\n\n"
                      + (.kept | map("- #" + (.number|tostring) + " (`" + .branch + "`) — " + .why) | join("\n"))
               end)' "$RUNNER_TEMP/supersede.json"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Dry run — nothing was closed._" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Dry run: $(jq -r '.close | length' "$RUNNER_TEMP/supersede.json") pull request(s) would have been closed."
            exit 0
          fi

          jq -r '.close[] | "\(.number)\t\(.branch)"' "$RUNNER_TEMP/supersede.json" \
          | while IFS=$'\t' read -r NUMBER BRANCH; do
              gh pr close "$NUMBER" --repo "$GH_REPO" --comment \
                "Superseded by the update to \`${REFERENCE}\`, which is cumulative: \`copier update\` runs from the version recorded on the default branch, so the newer branch already contains everything this one carried. Closed automatically because every commit here is the update bot's and nothing had been repaired or resolved on top. Reopen it if that reads wrong — the branch is untouched."
              echo "::notice::Closed #${NUMBER} (${BRANCH}) as superseded by ${REFERENCE}."
            done

      - name: Summary
        if: always()
        env:
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          SKIP_EXISTING: ${{ steps.existing.outputs.skip }}
          TEMPLATE_REPO: ${{ steps.check.outputs.template_repo }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          HAS_CONFLICTS: ${{ steps.update.outputs.has_conflicts }}
          CONFLICT_COUNT: ${{ steps.update.outputs.conflict_count }}
          COMMIT_LANDED: ${{ steps.update.outputs.commit_landed }}
          CHANGELOG_OK: ${{ steps.update.outputs.changelog_updated }}
        run: |
          # Each branch below interleaves its appends with conditionals, so the
          # grouped form shellcheck suggests would put a `{ ... }` around most
          # of the step. Style only — the quoting rule that actually matters
          # here (SC2086) is enforced.
          # shellcheck disable=SC2129
          if [ "$SKIP_EXISTING" = "true" ]; then
            echo "## Update PR Already Open" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "An open PR for **${LATEST_VERSION}** already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with \`force_update\` to regenerate it (this force-pushes the PR branch)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$NEEDS_UPDATE" = "true" ]; then
            echo "## Template Update Applied" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Template | ${TEMPLATE_REPO} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Current | ${CURRENT_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Latest | ${LATEST_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Pull request | ${PR_NUMBER:-**none created**} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Conflicts | ${CONFLICT_COUNT:-0} |" >> "$GITHUB_STEP_SUMMARY"
            # Defaulted because this step runs with `always()`: when the update
            # step itself failed there are no outputs to read, and an empty
            # cell reads as "no" rather than "never got that far".
            echo "| \`_commit\` bumped | ${COMMIT_LANDED:-did not run} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| AI CHANGELOG | ${CHANGELOG_OK:-did not run} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$HAS_CONFLICTS" = "true" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Conflicts**: the PR is a draft and needs manual resolution." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Template Up to Date" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current template version **${CURRENT_VERSION}** is the latest." >> "$GITHUB_STEP_SUMMARY"
          fi
