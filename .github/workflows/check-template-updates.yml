# Check for new copier template versions and create notification PR
#
# This workflow:
# 1. Runs daily (or manually) to check for new template releases
# 2. Compares with current template version in .copier-answers.yml
# 3. If newer version found, creates a notification PR with:
#    - Version comparison
#    - Changelog between versions
#    - Step-by-step update instructions

name: Check Template Updates

on:
  schedule:
    # Run daily at 10:00 UTC (1 hour after upstream check at 09:00)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Specific version to check against (leave empty for latest)'
        required: false
        default: ''
        type: string

jobs:
  check-template:
    runs-on: ubuntu-latest
    # All writes (checkout push, PR creation, branch push) go through the App
    # token; the default GITHUB_TOKEN needs no write access here.
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Check for template updates
        id: check
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          # Build arguments
          ARGS="--ci-output $GITHUB_OUTPUT"

          if [ -n "$TARGET_VERSION" ]; then
            # Manual input is interpolated into ARGS and reaches a shell before
            # the Dart checker can validate it. The template's own tags are
            # plain semver, optionally v-prefixed.
            if [[ ! "$TARGET_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::target_version must use the vX.Y.Z or X.Y.Z form."
              exit 2
            fi
            ARGS="$ARGS --version $TARGET_VERSION"
          fi

          echo "Running: make check-template-updates ARGS=\"$ARGS\""
          # `|| true` is unavoidable, and the exit code is unusable as a signal:
          # the checker exits 1 for "update available", and GNU make collapses any
          # non-zero recipe status into its own exit 2 (verified: a recipe exiting
          # 1 makes `make` exit 2), so 2 cannot be told apart from a crash.
          make check-template-updates ARGS="$ARGS" || true

          # What can tell them apart is the outputs file: the checker writes it
          # before signalling, and not at all when it throws. Without this gate a
          # broken checker looks exactly like "already up to date" and the workflow
          # stays green forever while silently never opening another notification.
          if ! grep -q '^needs_update=' "$GITHUB_OUTPUT"; then
            echo "::error::Template update checker wrote no result — it failed before reporting. Check the step log above; do NOT read this as 'up to date'."
            exit 1
          fi

          echo "Check completed. Outputs:"
          cat $GITHUB_OUTPUT || true

      - name: Create Notification PR
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: |
            chore: template update available (${{ steps.check.outputs.latest_version }})
          title: "Template update available: ${{ steps.check.outputs.latest_version }}"
          body: |
            ## Template Update Available

            A new version of the [copier-dart-frb-wrapper](https://github.com/${{ steps.check.outputs.template_repo }}) template is available.

            ### Version Change

            | Component | Current | Latest |
            |-----------|---------|--------|
            | Template  | ${{ steps.check.outputs.current_version }} | ${{ steps.check.outputs.latest_version }} |

            ${{ steps.check.outputs.changelog != '' && '### What Changed' || '' }}

            ${{ steps.check.outputs.changelog }}

            ### How to Update

            1. **Install/update copier:**
               ```bash
               pip install copier jinja2-strcase
               ```

            2. **Run copier update:**
               ```bash
               copier update --trust --vcs-ref=${{ steps.check.outputs.latest_version }}
               ```

            3. **Review changes** — resolve any conflicts, check generated files

            4. **Run quality checks:**
               ```bash
               make analyze
               make test
               ```

            5. **Commit the changes**

            ### Links

            - [Full comparison](${{ steps.check.outputs.compare_url }})
            - [Release notes](${{ steps.check.outputs.release_url }})

            ---
            *This PR was created automatically by the template update checker.*
          branch: update-template-${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: |
            template
            automated

      - name: Summary
        env:
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          TEMPLATE_REPO: ${{ steps.check.outputs.template_repo }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
        run: |
          if [ "$NEEDS_UPDATE" = "true" ]; then
            echo "## Template Update Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Template | ${TEMPLATE_REPO} |" >> $GITHUB_STEP_SUMMARY
            echo "| Current | ${CURRENT_VERSION} |" >> $GITHUB_STEP_SUMMARY
            echo "| Latest | ${LATEST_VERSION} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A notification PR has been created." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Template Up to Date" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Current template version **${CURRENT_VERSION}** is the latest." >> $GITHUB_STEP_SUMMARY
          fi
