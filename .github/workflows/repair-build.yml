# Propose a fix when CI is red.
#
# TWO SHAPES OF RED, and the difference between them is the reason this file is
# as long as it is:
#
#   mode=main  the default branch is red. Everybody is blocked. The repair
#              becomes a new branch and a pull request against `main`.
#   mode=pr    a BOT'S PULL REQUEST is red — the one that pins a newer version
#              of the dependency this package wraps, where the new version
#              changed the shape of an API this code calls. Its failing checks
#              are required ones, so that pull request can never reach `main`
#              and the red never appears there. Watching `main` alone left this
#              entire class invisible, which is what mode=pr exists for. The
#              repair becomes a COMMIT ON THAT BRANCH; no second pull request
#              is opened, because the one that matters already exists.
#
# The shape is several jobs rather than one, and that is the security design
# rather than tidiness:
#
#   detect   — decides whether there is anything to do, deterministically
#   repair   — regenerates, then runs the agent; holds NO write credential
#   propose  — mints the App token and opens a pull request   (main, fixed)
#   commit   — mints the App token and commits to the branch  (pr,   fixed)
#   report   — mints the App token and files an issue         (main, cannot-fix)
#   remark   — mints the App token and comments on the branch (pr,   cannot-fix)
#   resolve  — closes those issues once `main` is green again (housekeeping)
#
# The last five are the only ones that can write, and none of them runs an
# agent. Which one runs is decided by the mode and the agent's verdict, and they
# are mutually exclusive.
#
# In mode=pr the agent is not always reached. The commonest cause of a red bot
# pull request here is not an upstream API change at all — it is that the update
# workflow could not RUN the binding generator, so it labelled the pull request
# `codegen-failed` and left stale bindings behind. Measured on this repository's
# history: 31 pull requests carried that label and 3 were genuine API changes.
# So `repair` regenerates first, deterministically, and only calls a model when
# that fails. A model is for the case where something has to be decided.
#
# Note where that leaves the gate: the regeneration is inside the `repair` job,
# so it runs only where an agent is configured, although it calls no model. That
# is deliberate and not an oversight — a repository that has not opted into
# agents has not opted into this workflow writing to its branches either, and
# "switched off" should mean one thing rather than two.
#
# The agent job never has a token that can write to this repository. Not in a
# later step, not in `.git/config` from the checkout, not in the environment.
# The App token is minted in a job the agent does not run in and cannot reach,
# after its work has already been reduced to a patch file.
#
# Everything the agent needs to know is fetched by a deterministic step before
# it starts — the failing run, its log — so the agent spends its turns on the
# problem rather than on discovery.
#
# The oracle is real: the pull request this opens is checked by the same
# four-platform matrix as any other, so a wrong fix fails loudly and cheaply.

name: Repair Build

on:
  schedule:
    # Daily, after the nightly window and before the working day. This is the
    # one that serves `main`.
    - cron: '0 5 * * *'
    # And once more, after the update bot has opened its pull requests and CI
    # has had time to rule on them. Measured in the project this template came
    # from: the update workflow runs at 09:00, so a branch broken by an upstream
    # change would otherwise wait until 05:00 the following day — twenty hours
    # in which nobody is told. The extra run costs nothing on a quiet day: it
    # exits in `detect`, and the concurrency group below means the two can never
    # overlap.
    - cron: '0 11 * * *'
  # Manual runs only. There is deliberately no issue, comment or pull_request
  # trigger: those carry text written by whoever opened them straight into an
  # agent's context. `workflow_dispatch` is the one manual trigger that requires
  # write access to the repository, so its inputs come from someone who could
  # push the same content directly — they widen no boundary. Do not add a
  # trigger that anyone else can reach.
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          Failing Tests run to repair. Empty means: the latest completed run on
          main, and failing that, the oldest red bot pull request. Naming a run
          is how this workflow gets exercised without waiting for something to
          break for real — a run on a pull-request branch selects mode=pr, and a
          named run may point at a branch whose pull request is closed, which
          the scheduled search would never choose. Whenever a named run is not
          judging the current head of its branch, the dry run is forced.
        required: false
        default: ''
      dry_run:
        description: >-
          Change nothing outside this run: produce the patch as an artifact,
          open no pull request, file no issue and close none.
        required: false
        default: false
        type: boolean

# Least privilege for the whole file. `actions: read` is for reading the failing
# run's log; every write is made by the `propose` job with a GitHub App token.
permissions:
  contents: read
  actions: read

# One repair at a time. A second run starting while the first is mid-flight
# would race it to the same branch, and neither is urgent enough to cancel the
# other.
concurrency:
  group: repair-build
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Is main broken, and is this failure new?
  # ==========================================================================
  detect:
    name: Detect a broken main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Named at the job rather than raised for the whole file, so the job the
    # agent runs in keeps the narrowest token of the five. `pull-requests: read`
    # is for the duplicate check below, which asks `gh pr list` whether this
    # exact failure already has a pull request — under `github.token`, since
    # only the writing jobs mint the App token. The file-level block grants
    # `contents` and `actions` and nothing else, so without this line that call
    # has no permission for the resource it reads. `resolve` already carries the
    # same thing for `issues: read` and the same reason; `detect` was the one
    # that asks the API a question its token was never given.
    #
    # It would only ever have failed on the path this workflow exists for: the
    # step is gated on `main` actually being broken, so no rehearsal and no
    # green day reaches it.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      # For the mode=pr deduplication, which asks whether this exact head has
      # already been answered. A comment on a pull request is an ISSUE comment
      # as far as the API and its permissions are concerned, so `pull-requests`
      # alone does not reach it — and the call degrades quietly to "nothing
      # found", which would make the workflow repeat itself nightly instead of
      # failing.
      issues: read
    outputs:
      broken: ${{ steps.failure.outputs.broken }}
      conclusion: ${{ steps.failure.outputs.conclusion }}
      skip: ${{ steps.existing.outputs.skip }}
      run_id: ${{ steps.failure.outputs.run_id }}
      run_url: ${{ steps.failure.outputs.run_url }}
      sha: ${{ steps.failure.outputs.sha }}
      branch: ${{ steps.failure.outputs.branch }}
      dry_run: ${{ steps.failure.outputs.dry_run }}
      # Which of the two shapes of red this run is dealing with; the header of
      # this file says what each one means. Every job below reads it, because
      # "what a repair becomes" differs between them and nothing else does.
      mode: ${{ steps.failure.outputs.mode }}
      pr_number: ${{ steps.failure.outputs.pr_number }}
      # Whether the update workflow left the bindings unregenerated. It decides
      # whether `repair` tries the deterministic route before waking a model,
      # and it is the one label this workflow may remove.
      codegen_failed: ${{ steps.failure.outputs.codegen_failed }}
      # `main`'s own state, regardless of what this run picked. `resolve` closes
      # the reports filed for a red `main`, so it has to ask about `main` and
      # not about whichever target was selected.
      main_conclusion: ${{ steps.failure.outputs.main_conclusion }}
      configured: ${{ steps.config.outputs.configured }}
      engine: ${{ steps.config.outputs.engine }}
      model: ${{ steps.config.outputs.model }}

    steps:
      # No engine and no model are chosen for you. This mirrors `AI_MODELS`,
      # which deliberately has no default for the same reason: something that
      # writes into this repository should be named by a person, not inherited
      # from whatever a template happened to ship. A generated project that has
      # not opted in gets a workflow that quietly does nothing, rather than one
      # that silently starts spending on a model nobody chose.
      #
      # The three outcomes are deliberately different:
      #
      #   nothing set        -> notice, and the repair job never runs. Not an
      #                         error: not opting in is a legitimate choice, and
      #                         failing daily would train people to ignore this.
      #   engine set, no model -> error. Half-configured is a mistake, not a
      #                         choice, and the difference is worth a red run.
      #   engine unrecognised -> error. This used to fall through to Claude Code,
      #                         which meant a typo silently ran an engine and a
      #                         model nobody asked for.
      - name: Check that an engine and a model were chosen
        id: config
        env:
          ENGINE: ${{ vars.AGENT_ENGINE }}
          CLAUDECODE_MODEL: ${{ vars.AGENT_CLAUDECODE_MODEL }}
          OPENCODE_MODEL: ${{ vars.AGENT_OPENCODE_MODEL }}
        run: |
          set -euo pipefail

          if [ -z "${ENGINE:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AGENT_ENGINE is not set, so no repair will be attempted. Set it to 'claude-code' or 'opencode', together with the matching model variable, to enable this workflow."
            exit 0
          fi

          case "$ENGINE" in
            claude-code) MODEL="${CLAUDECODE_MODEL:-}"; MODEL_VAR=AGENT_CLAUDECODE_MODEL ;;
            opencode)    MODEL="${OPENCODE_MODEL:-}"; MODEL_VAR=AGENT_OPENCODE_MODEL ;;
            *)
              echo "::error::AGENT_ENGINE is '${ENGINE}', which is not an engine this workflow knows. Use 'claude-code' or 'opencode'."
              exit 1
              ;;
          esac

          if [ -z "$MODEL" ]; then
            echo "::error::AGENT_ENGINE is '${ENGINE}' but ${MODEL_VAR} is not set. Name the model this repository should run; there is deliberately no default."
            exit 1
          fi

          {
            echo "configured=true"
            echo "engine=$ENGINE"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Repairs will run on ${ENGINE} / ${MODEL}."

      - name: Find the run to repair
        id: failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.run_id }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # ------------------------------------------------------------------
          # One target, one mode, chosen here and nowhere else. The header of
          # this file says what `main` and `pr` mean; this is where the choice
          # is made, deterministically, with no model anywhere near it.
          # ------------------------------------------------------------------

          # `main`'s own state, first and unconditionally. `resolve` needs it:
          # it retires the reports filed for a red `main`, and "the target this
          # run picked is not broken" stopped being the same question as "main
          # is green" the moment this step learned to pick a pull request.
          MAIN_RUN=$(gh run list --workflow=test.yml --branch=main --status=completed \
                       --limit=1 --json conclusion,databaseId,headSha,url)
          MAIN_CONCLUSION=$(jq -r '.[0].conclusion // "none"' <<<"$MAIN_RUN")
          echo "main_conclusion=$MAIN_CONCLUSION" >> "$GITHUB_OUTPUT"

          TIP=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
          DRY_RUN="${REQUESTED_DRY_RUN:-false}"

          MODE=""
          RUN=""
          PR_NUMBER=""
          BRANCH=""
          CODEGEN_FAILED=false
          CONCLUSION="$MAIN_CONCLUSION"

          # ---------------------------------------------------------------- #
          # A named run: the rehearsal path, and the manual escape.
          # ---------------------------------------------------------------- #
          if [ -n "$REQUESTED_RUN" ]; then
            RUN=$(gh run view "$REQUESTED_RUN" \
                    --json conclusion,databaseId,headSha,url,headBranch | jq -c '[.]')
            CONCLUSION=$(jq -r '.[0].conclusion // "none"' <<<"$RUN")
            SHA=$(jq -r '.[0].headSha' <<<"$RUN")
            HEAD_BRANCH=$(jq -r '.[0].headBranch' <<<"$RUN")

            if [ "$CONCLUSION" != "failure" ]; then
              echo "broken=false" >> "$GITHUB_OUTPUT"
              echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
              echo "::notice::Run conclusion is '$CONCLUSION' — nothing to repair."
              exit 0
            fi

            if [ "$HEAD_BRANCH" = "main" ]; then
              MODE="main"
              CURRENT="$TIP"
            else
              MODE="pr"
              BRANCH="$HEAD_BRANCH"
              # Looked up, but NOT required to be open. A named run is the only
              # way to exercise this path at all, and every red pull-request run
              # old enough to be safe to rehearse against belongs to one
              # somebody has since closed. The write end comes off instead —
              # see the dry-run forcing below, which covers both that and a
              # branch that has moved on.
              PR_JSON=$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --state all \
                          --limit 1 --json number,state,labels)
              PR_NUMBER=$(jq -r '.[0].number // ""' <<<"$PR_JSON")
              PR_STATE=$(jq -r '.[0].state // "NONE"' <<<"$PR_JSON")
              CODEGEN_FAILED=$(jq -r '[.[0].labels[]?.name] | index("codegen-failed") != null' <<<"$PR_JSON")
              CURRENT=$(gh api "repos/$GH_REPO/git/ref/heads/$HEAD_BRANCH" --jq '.object.sha' 2>/dev/null || echo "")

              if [ "$PR_STATE" != "OPEN" ]; then
                DRY_RUN=true
                echo "::warning::The pull request for ${HEAD_BRANCH} is ${PR_STATE}, not OPEN — forcing a dry run. A closed pull request is a decision somebody made, and committing to its branch would overrule it."
              fi
            fi

            # The guard, asked of whichever branch this is. On `main` the reason
            # is that a branch cut from an older tree reverts whatever landed in
            # between. On a pull-request branch nothing is reverted — the commit
            # is appended — but the question is the same one, "has CI ruled on
            # what is there NOW", and a repair reasoned about against a
            # superseded tree is wrong for the same reason.
            if [ "$SHA" != "$CURRENT" ]; then
              DRY_RUN=true
              echo "::warning::Run ${REQUESTED_RUN} judged ${SHA:0:12} but ${HEAD_BRANCH} is at ${CURRENT:0:12} — forcing a dry run; nothing will be written."
            fi

          else
            # -------------------------------------------------------------- #
            # Scheduled. `main` first: a red default branch blocks everybody, a
            # red update branch blocks one dependency bump.
            # -------------------------------------------------------------- #
            RUN="$MAIN_RUN"

            if [ "$MAIN_CONCLUSION" = "failure" ]; then
              SHA=$(jq -r '.[0].headSha' <<<"$MAIN_RUN")
              if [ "$SHA" = "$TIP" ]; then
                MODE="main"
              else
                echo "::notice::The red run judged ${SHA:0:12} but main is now at ${TIP:0:12} — waiting for CI to rule on the current tip."
              fi
            fi

            # -------------------------------------------------------------- #
            # Then the bot pull requests. Every condition below is a boundary
            # rather than a preference:
            #
            #   open            — a closed pull request is a decision somebody
            #                     made; committing to its branch overrules it.
            #   same repository — a fork's branch cannot be pushed to, and
            #                     running an agent over a fork's tree in a
            #                     workflow that later mints an App token is
            #                     precisely the shape this file is arranged to
            #                     avoid.
            #   author is a bot — a person's branch is that person's to fix.
            #   `automated`     — the label this project's own update workflows
            #                     apply, and what separates them from any other
            #                     app that may open pull requests here.
            #   not dependabot  — its branches are RECREATED rather than
            #                     rebased, so a commit added here is discarded
            #                     without warning the next time it refreshes
            #                     one. `refresh-notices.yml` lives with the same
            #                     property by force-pushing, which is not
            #                     available here: `dependabot/**` is the one
            #                     prefix the signing ruleset's non-fast-forward
            #                     rule excludes.
            #
            # Oldest first. A bot opens a new pull request per upstream release
            # and the older one is the one a human has been waiting on.
            # -------------------------------------------------------------- #
            if [ -z "$MODE" ]; then
              CANDIDATES=$(gh pr list --repo "$GH_REPO" --state open --label automated \
                             --limit 50 \
                             --json number,headRefName,headRefOid,isCrossRepository,author,labels \
                | jq -c '[ .[]
                    | select(.isCrossRepository == false)
                    | select(.author.is_bot == true)
                    | select(.author.login | ascii_downcase | contains("dependabot") | not)
                    | {number, head: .headRefName, oid: .headRefOid,
                       labels: [.labels[].name]} ]
                    | sort_by(.number)')

              for n in $(jq -r '.[].number' <<<"$CANDIDATES"); do
                C=$(jq -c --argjson n "$n" '.[] | select(.number == $n)' <<<"$CANDIDATES")
                HEAD=$(jq -r '.head' <<<"$C")
                OID=$(jq -r '.oid' <<<"$C")
                LABELLED=$(jq -r '.labels | index("codegen-failed") != null' <<<"$C")

                PRUN=$(gh run list --workflow=test.yml --branch="$HEAD" --status=completed \
                         --limit=1 --json conclusion,databaseId,headSha,url)
                PCONCL=$(jq -r '.[0].conclusion // "none"' <<<"$PRUN")
                PSHA=$(jq -r '.[0].headSha // ""' <<<"$PRUN")

                # Two independent kinds of evidence, and they are a disjunction.
                #
                #   the label — the update workflow could not regenerate the
                #     bindings, so what is committed under the generated paths
                #     does not correspond to the pin this branch carries. That
                #     is true of the TREE and so survives a push; it is also a
                #     required check failing on its own, whatever Tests says.
                #   a red run — but only one that judged THIS head. A failure
                #     against an earlier commit says nothing about this one.
                RED=false
                if [ "$PCONCL" = "failure" ] && [ "$PSHA" = "$OID" ]; then
                  RED=true
                fi

                if [ "$LABELLED" = "true" ] || [ "$RED" = "true" ]; then
                  MODE="pr"
                  PR_NUMBER="$n"
                  BRANCH="$HEAD"
                  SHA="$OID"
                  CODEGEN_FAILED="$LABELLED"
                  if [ "$RED" = "true" ]; then
                    RUN="$PRUN"
                    CONCLUSION="failure"
                  else
                    # Labelled but Tests has not failed on this head — there may
                    # be no failing run to read at all. The regeneration below
                    # does not need one; it reads the tree.
                    RUN='[]'
                    CONCLUSION="codegen-failed"
                  fi
                  break
                fi
              done
            fi
          fi

          if [ -z "$MODE" ]; then
            echo "broken=false" >> "$GITHUB_OUTPUT"
            echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to repair: the latest completed Tests run on main concluded '$MAIN_CONCLUSION', and no bot pull request is red."
            exit 0
          fi

          {
            echo "broken=true"
            echo "mode=$MODE"
            echo "dry_run=$DRY_RUN"
            echo "conclusion=$CONCLUSION"
            echo "pr_number=$PR_NUMBER"
            echo "codegen_failed=$CODEGEN_FAILED"
            echo "run_id=$(jq -r '.[0].databaseId // ""' <<<"$RUN")"
            echo "run_url=$(jq -r '.[0].url // ""' <<<"$RUN")"
            echo "sha=$SHA"
            # In mode=main this NAMES A BRANCH TO CREATE, keyed by the commit
            # that broke so one failure gets one attempt. In mode=pr it is the
            # branch that already exists and will be committed to. Either way it
            # is "where the repair lands", which is what every job below asks.
            if [ "$MODE" = "main" ]; then
              echo "branch=repair-build-${SHA:0:12}"
            else
              echo "branch=$BRANCH"
            fi
          } >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "main" ]; then
            echo "::warning::Repairing main at ${SHA:0:12} — $(jq -r '.[0].url // "no run"' <<<"$RUN")"
          else
            echo "::warning::Repairing #${PR_NUMBER} (${BRANCH}) at ${SHA:0:12} — codegen-failed=${CODEGEN_FAILED}, $(jq -r '.[0].url // "no failing run"' <<<"$RUN")"
          fi

      # Not consulted on a dry run: there is nothing to collide with, and
      # skipping would defeat the only way to rehearse this workflow twice.
      - name: Skip what has already been answered
        id: existing
        if: steps.failure.outputs.broken == 'true' && steps.failure.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ steps.failure.outputs.mode }}
          BRANCH: ${{ steps.failure.outputs.branch }}
          SHA: ${{ steps.failure.outputs.sha }}
          PR_NUMBER: ${{ steps.failure.outputs.pr_number }}
        run: |
          set -euo pipefail

          # One write, at the end. `$GITHUB_OUTPUT` takes the last value for a
          # repeated key, so writing a default first and overwriting it would
          # work — and would rest a decision about whether to touch anything on
          # a file-format detail nobody should have to know.
          SKIP=false

          if [ "$MODE" = "main" ]; then
            # `--state all`, not just open. An open one must not be force-pushed
            # over. A closed one means a human has already seen this exact
            # failure and declined the fix, and re-proposing it every night is
            # how automation teaches people to stop reading it.
            COUNT=$(gh pr list --head "$BRANCH" --state all --json number --jq 'length')
            if [ "$COUNT" != "0" ]; then
              SKIP=true
              echo "::notice::A pull request for $BRANCH already exists (open or closed) — skipping."
            fi
            echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # mode=pr has no new pull request to look for, so the two questions
          # that matter are asked of the branch and of the pull request instead.
          #
          # 1. Has an agent already had its turn on this branch? One is the cap.
          #    A repair is a proposal; a second attempt layered on an unreviewed
          #    first is how an agent talks itself somewhere nobody followed. The
          #    deterministic regeneration does not count against it — it decides
          #    nothing, it can only happen once, and it is how most of these are
          #    answered.
          AGENT_COMMITS=$(gh api "repos/$GH_REPO/compare/main...$BRANCH" \
                            --jq '[.commits[].commit.message | select(test("repair-build: [0-9a-f]+ \\(agent\\)"))] | length' \
                          2>/dev/null || echo 0)
          if [ "${AGENT_COMMITS:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${BRANCH} already carries an agent repair — one attempt per branch. Whatever is still red there is a human's call."
            exit 0
          fi


          # 2. Has a MODEL already answered this exact head? The marker rather
          #    than the prose, for the reason the issue path gives: prose gets
          #    edited. Keyed by the head commit, so a push re-arms it.
          #
          #    Without this the commonest genuine outcome loops. An upstream
          #    change the agent declines leaves no commit and does not clear the
          #    `codegen-failed` label — only a successful repair does — so
          #    nothing about the branch changes, and it would be selected again
          #    the next night, and the night after, at a toolchain build and a
          #    model run each time.
          #
          #    `:agent` specifically, because a deterministic regeneration that
          #    wrote nothing also leaves a comment on an unmoved head, and that
          #    one must NOT suppress a later model attempt: it decided nothing.
          #
          #    `gh pr view`, not `gh api --paginate`: the latter applies the jq
          #    filter once per page and concatenates, so a pull request past the
          #    first page of comments answers `0\n0` and the numeric test below
          #    fails as a non-integer — quietly disabling the guard on exactly
          #    the long-lived pull request that needs it most.
          if [ -n "$PR_NUMBER" ]; then
            SEEN=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json comments \
                     --jq "[.comments[] | select(.body | contains(\"repair-build:${SHA}:agent\"))] | length" \
                   2>/dev/null || echo 0)
            if [ "${SEEN:-0}" -gt 0 ]; then
              SKIP=true
              echo "::notice::#${PR_NUMBER} already carries an agent's diagnosis for ${SHA:0:12} — not repeating it."
            fi
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # The other half of the summary in the `repair` job below, and the half
      # that matters more often: most runs of this workflow stop here, and until
      # now they left a green tick and an annotation somebody had to go looking
      # for. "The automation is switched off" and "the automation looked and
      # main is fine" are very different facts that produced the same-looking
      # run.
      - name: Summarise the decision
        if: always()
        env:
          BROKEN: ${{ steps.failure.outputs.broken }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          ENGINE: ${{ steps.config.outputs.engine }}
          MODEL: ${{ steps.config.outputs.model }}
          CONCLUSION: ${{ steps.failure.outputs.conclusion }}
          MAIN_CONCLUSION: ${{ steps.failure.outputs.main_conclusion }}
          SKIP: ${{ steps.existing.outputs.skip }}
          SHA: ${{ steps.failure.outputs.sha }}
          RUN_URL: ${{ steps.failure.outputs.run_url }}
          MODE: ${{ steps.failure.outputs.mode }}
          PR_NUMBER: ${{ steps.failure.outputs.pr_number }}
          BRANCH: ${{ steps.failure.outputs.branch }}
          CODEGEN_FAILED: ${{ steps.failure.outputs.codegen_failed }}
          DRY_RUN: ${{ steps.failure.outputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "## Build repair — what this run decided"
            echo
            if [ "${CONFIGURED:-}" != "true" ]; then
              echo "**Nothing was attempted: no agent is configured.** Set \`AGENT_ENGINE\`"
              echo "to \`claude-code\` or \`opencode\`, and the matching model variable, to"
              echo "switch this on. This is not a failure — it is what an unconfigured"
              echo "repository is supposed to look like."
            elif [ "${BROKEN:-}" != "true" ]; then
              echo "**Nothing to repair.** The latest completed Tests run on \`main\`"
              echo "concluded \`${MAIN_CONCLUSION:-unknown}\`, and no bot pull request is red."
              echo
              echo "Agent that would have run: \`${ENGINE}\` / \`${MODEL}\`."
            elif [ "${SKIP:-}" = "true" ]; then
              echo "**Already handled.** \`${SHA:0:12}\` has been answered once already,"
              echo "and answering it again every night is how automation teaches people"
              echo "to stop reading it."
            elif [ "${MODE:-}" = "pr" ]; then
              echo "Repairing **#${PR_NUMBER}** (\`${BRANCH}\`) at \`${SHA:0:12}\`."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Mode | \`pr\` — the repair becomes a commit on that branch |"
              echo "| Bindings unregenerated | \`${CODEGEN_FAILED}\` |"
              echo "| Failing run | ${RUN_URL:-none — the label is the evidence} |"
              echo "| Agent | \`${ENGINE}\` / \`${MODEL}\`, if the regeneration does not settle it |"
              echo "| Dry run | \`${DRY_RUN}\` |"
            else
              echo "Repairing \`main\` at \`${SHA:0:12}\` with \`${ENGINE}\` / \`${MODEL}\`."
              echo
              echo "Failing run: ${RUN_URL:-unknown}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # The agent. No write credential exists anywhere in this job.
  # ==========================================================================
  repair:
    name: Attempt a repair
    needs: detect
    if: >-
      needs.detect.outputs.broken == 'true' &&
      needs.detect.outputs.skip != 'true' &&
      needs.detect.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Longer in mode=pr, because that mode adds work this job did not used to
    # do: installing the binding generator, running it, and copying the
    # upstream source the agent reads — all before the agent's own `make build`,
    # which on a fresh dependency pin is a cold build of the whole tree.
    timeout-minutes: ${{ needs.detect.outputs.mode == 'pr' && 90 || 60 }}

    outputs:
      status: ${{ steps.verdict.outputs.status }}
      changed: ${{ steps.patch.outputs.changed }}
      # Whether regenerating the bindings settled it without a model. See the
      # header: most red bot pull requests here are a generator that did not
      # run, not an upstream that changed shape.
      recovered: ${{ steps.regenerate.outputs.recovered }}
      # `moved` when this package's own generated Dart surface gained, lost or
      # changed a parameter — measured, not asked. The routing downstream reads
      # this rather than the agent's self-report.
      surface: ${{ steps.surface.outputs.surface }}
      surface_disagreed: ${{ steps.surface.outputs.disagreed }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          # Deliberately the default, read-only GITHUB_TOKEN. Checking out with
          # the App token would leave a credential in .git/config that the
          # agent's Bash tool can read and push with, which would defeat the
          # entire job split.
          persist-credentials: false

      - name: Fetch the failing log
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.detect.outputs.run_id }}
          RUN_URL: ${{ needs.detect.outputs.run_url }}
          SHA: ${{ needs.detect.outputs.sha }}
          MODE: ${{ needs.detect.outputs.mode }}
          BRANCH: ${{ needs.detect.outputs.branch }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -euo pipefail

          # Which branch's history is worth showing. In mode=main `branch` names
          # a branch that does not exist yet — the one a fix would be proposed
          # on — so the history to read is the default branch's. In mode=pr it
          # is the branch under repair, and its own runs are what say whether a
          # symptom has been striking the same test or a different one.
          if [ "${MODE:-main}" = "pr" ]; then
            CTX_BRANCH="$BRANCH"
          else
            CTX_BRANCH="main"
          fi

          mkdir -p .agent-scratch
          # Belt and braces with the `rm -rf` after the agent runs: if the
          # directory somehow survives, git still never sees it.
          echo '.agent-scratch/' >> .git/info/exclude

          # Written here, in the step that runs in BOTH modes, because the
          # prompt states unconditionally that this file says which mode the
          # agent is in. Writing it only on the mode=pr path would leave the
          # path that already worked looking for a file that is not there.
          {
            echo "MODE=${MODE:-main}"
            echo "PR_NUMBER=${PR_NUMBER:-}"
            echo "BRANCH=${BRANCH:-}"
          } > .agent-scratch/mode.env

          # Deterministic, and done here rather than by the agent on purpose.
          # Reads that a script can do cost an agent turns, and turns spent on
          # discovery are turns not spent on the problem.
          # mode=pr can select a pull request on the strength of the
          # `codegen-failed` label alone, and a label is attached to a pull
          # request rather than to a run — so there may be no failing run to
          # read at all. The regeneration below reads the tree instead, and the
          # agent, if it is reached, gets the generator's own errors, which are
          # better evidence than a CI log of the same thing.
          if [ -z "${RUN_ID:-}" ]; then
            echo "::notice::No failing run to read — the evidence is the tree."
            {
              echo "RUN_URL=${RUN_URL:-none}"
              echo "SHA=$SHA"
            } > .agent-scratch/failure.env
            exit 0
          fi

          gh run view "$RUN_ID" --log-failed > .agent-scratch/build-failure.raw

          # Bounded. A pathological log — a dependency looping on a warning —
          # would otherwise fill the context with one repeated line and push the
          # actual error out of it.
          head -c 400000 .agent-scratch/build-failure.raw > .agent-scratch/build-failure.log
          rm -f .agent-scratch/build-failure.raw

          # A CI log is mostly toolchain noise, and the whole of it is paid for
          # on every turn of the agent's loop, not once. Measured on a real
          # failure: 218 KB of log, ~55K tokens, against a context of ~100K read
          # back 2.2M times over 24 turns — the log, not the model tier, is what
          # a run costs. The signal is the error lines and what surrounds them,
          # which came to 13 KB for the same failure: 17x less.
          #
          # Both files are written and the summary is only the entry point. A
          # distillation that silently dropped the cause would be a far more
          # expensive mistake than a large context, so the full log stays on
          # disk and the prompt says when to reach for it.
          #
          # grep rather than awk: `IGNORECASE` is a GNU extension, and the
          # runner's awk is mawk.
          grep -iE -B15 -A15 \
            '##\[error\]|##\[group\]❌|panicked|Exception|tests passed|[0-9]+ tests? failed' \
            .agent-scratch/build-failure.log > .agent-scratch/build-failure.summary || true

          # An empty summary means none of the anchors matched — an unfamiliar
          # failure shape. Fall back to the whole log rather than handing over
          # nothing, and say so, because a silent empty summary would read to
          # the agent as "nothing went wrong".
          if [ ! -s .agent-scratch/build-failure.summary ]; then
            echo "::warning::No known error markers in the log — the summary is the full log."
            cp .agent-scratch/build-failure.log .agent-scratch/build-failure.summary
          fi

          {
            echo "RUN_URL=$RUN_URL"
            echo "SHA=$SHA"
          } > .agent-scratch/failure.env

          # Which legs failed, and what this workflow has been doing lately.
          #
          # Both rehearsals reached for exactly this and it was decisive: "every
          # other platform was green on the same SHA, and the timing-out test is
          # a different one each time" is what separates a flaky runner from a
          # regression, and neither fact is anywhere in the failing job's log.
          #
          # Fetched here rather than granting the agent `gh`. That would mean
          # putting a token in its environment and trusting a prefix match to
          # keep `gh` read-only, to obtain something a script gets for free.
          {
            echo "# Context for run $RUN_ID (gathered by the workflow, not the agent)"
            echo
            echo "## Every job in the failing run"
            echo
            echo "A leg that passed on this same commit is evidence the tree is fine."
            echo
            gh run view "$RUN_ID" --json jobs \
              --jq '.jobs[] | "- \(.conclusion // "?")\t\(.name)"'
            echo
            echo "## Recent Tests runs on ${CTX_BRANCH}, newest first"
            echo
            echo "The same symptom striking a different test each time is a flaky"
            echo "runner. A regression does not move between unrelated tests."
            echo
            gh run list --workflow=test.yml --branch="$CTX_BRANCH" --limit=20 \
              --json conclusion,headSha,databaseId,createdAt \
              --jq '.[] | "- \(.conclusion // "running")\t\(.headSha[0:12])\trun \(.databaseId)\t\(.createdAt)"'
          } > .agent-scratch/run-context.md 2>&1 || \
            echo "Context could not be gathered." > .agent-scratch/run-context.md

          echo "Log bytes: $(wc -c < .agent-scratch/build-failure.log)"

      # The same toolchain the Tests job sets up, so that `make build` here
      # means what it means there. Without it the agent cannot verify anything
      # and its only options are to guess or to give up.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Get dependencies
        run: make get

      # Not preinstalled on runners, and its absence is not a small gap: the
      # agent is allowed to run `make codegen` and is told never to hand-edit a
      # generated file, and without this step that command exits 127. The one
      # pull request this workflow has ever opened did exactly what the missing
      # binary leaves an agent with — it hand-edited the generated file to make
      # the complaint go away, and said in its own notes that it could not run
      # the generator. That was read as a model being careless. It was a
      # toolchain that was not there.
      #
      # Both modes, not just mode=pr: the failure that produced that pull
      # request was on `main`.
      - name: Install the binding generator
        run: make setup-frb-codegen

      # Everything below is mode=pr only and deterministic. It exists so that
      # the agent — if it is reached at all — starts from the generator's own
      # errors and from the upstream source, rather than from a CI log and an
      # inference.
      - name: Describe the update under repair
        if: needs.detect.outputs.mode == 'pr'
        env:
          BRANCH: ${{ needs.detect.outputs.branch }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          CODEGEN_FAILED: ${{ needs.detect.outputs.codegen_failed }}
        run: |
          set -euo pipefail
          mkdir -p .agent-scratch
          grep -qxF '.agent-scratch/' .git/info/exclude 2>/dev/null \
            || echo '.agent-scratch/' >> .git/info/exclude

          # What the bot changed, from the repository rather than from the pull
          # request's prose. The body of that pull request is text a workflow
          # composed and a human may since have edited; the diff is the fact.
          git fetch --no-tags --depth=200 origin main 2>/dev/null || true
          BASE=$(git merge-base FETCH_HEAD HEAD 2>/dev/null || echo "")

          {
            echo "# The update this branch carries"
            echo
            echo "Branch \`$BRANCH\`, pull request #$PR_NUMBER."
            echo "Bindings left unregenerated by the update workflow: \`$CODEGEN_FAILED\`."
            echo
            if [ -n "$BASE" ]; then
              echo "## The pin that moved"
              echo
              echo '```diff'
              git --no-pager diff "$BASE" HEAD -- 'rust/Cargo.toml' | head -c 8000
              echo '```'
              echo
              echo "## Everything the bot changed"
              echo
              git --no-pager diff --stat "$BASE" HEAD | head -c 8000
            else
              echo "_The merge base could not be resolved, so the bot's own diff is not shown._"
            fi
          } > .agent-scratch/update-context.md

      # `Grep` and `Glob` are scoped to the workspace — deliberately, so the
      # agent cannot read `/proc/self/environ`, where this job's secrets live.
      # The same scoping puts the vendored dependency under
      # `~/.cargo/git/checkouts/` out of reach, and that is the one thing the
      # decision in this mode actually turns on: "is the value available in
      # scope, or only at the caller?" cannot be answered from an error message,
      # which says what no longer fits and never what would. So the source is
      # copied to where the agent can read it, by a step rather than by a grant.
      #
      # Only git dependencies, which is what an upstream pinned by tag is here;
      # registry crates are not what this workflow repairs against. Measured on
      # this repository: five crates, about a megabyte in total.
      - name: Vendor the upstream source the agent may read
        if: needs.detect.outputs.mode == 'pr'
        run: |
          set -uo pipefail
          UP=.agent-scratch/upstream
          mkdir -p "$UP"

          # No `--locked`: a lockfile that does not match would abort the whole
          # step, and this is evidence rather than a gate. If it fails, the
          # agent is told the directory is absent and carries on without it.
          ( cd rust && cargo metadata --format-version 1 ) 2>/dev/null \
            | jq -r '.packages[]
                     | select(.source != null and (.source | startswith("git+")))
                     | [.name, .manifest_path] | @tsv' > "$RUNNER_TEMP/git-deps.tsv" || true

          COPIED=0
          while IFS=$'\t' read -r name manifest; do
            [ -n "${manifest:-}" ] || continue
            src="$(dirname "$manifest")/src"
            [ -d "$src" ] || continue
            mkdir -p "$UP/$name"
            cp -R "$src" "$UP/$name/" 2>/dev/null && COPIED=$((COPIED + 1))
          done < "$RUNNER_TEMP/git-deps.tsv"

          if [ "$COPIED" = 0 ]; then
            rm -rf "$UP"
            echo "::warning::No git-sourced dependency resolved, so there is no upstream source to read. The agent will be working from error text alone."
          else
            echo "Vendored $COPIED upstream crate(s), $(du -sh "$UP" | cut -f1)."
          fi
          exit 0

      # The deterministic route, and on this repository's history the one that
      # answers most of these. `codegen-failed` says the update workflow could
      # not RUN the generator — which is a different thing from upstream having
      # changed shape, and far commoner: 31 pull requests here carried that
      # label and 3 were genuine API changes. When the generator runs now, the
      # repair is whatever it writes, there is nothing to decide, and no model
      # is woken. When it does not, its errors are the best evidence that
      # exists of what upstream did, and they go to the agent.
      #
      # `set -e` is deliberately absent: the failure IS the information here.
      - name: Regenerate the bindings before waking a model
        id: regenerate
        if: needs.detect.outputs.mode == 'pr' && needs.detect.outputs.codegen_failed == 'true'
        run: |
          set -uo pipefail
          mkdir -p .agent-scratch

          if make codegen > "$RUNNER_TEMP/codegen.log" 2>&1; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The generator ran. Whatever it wrote is the repair; no model is needed."
            git --no-pager status --porcelain -- lib/src/rust/ rust/src/frb_generated.rs
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            # Bounded for the reason the CI log is bounded: it is paid for on
            # every turn of the agent's loop, not once.
            head -c 120000 "$RUNNER_TEMP/codegen.log" > .agent-scratch/codegen-failure.log
            echo "::warning::The generator failed against this pin — this is the shape an upstream API change takes here. Handing it to the agent."
            tail -40 "$RUNNER_TEMP/codegen.log"
            # Whatever a half-finished generation left behind is not a repair.
            # The agent starts from the tree as committed.
            git checkout -- lib/src/rust/ rust/src/frb_generated.rs 2>/dev/null || true
            git clean -fd -- lib/src/rust/ 2>/dev/null || true
          fi
          # A generator killed part-way leaves the marker that suppresses the
          # build hook at the repository root. It is outside the path allowlist,
          # so left behind it fails the run several steps later as an
          # unexplained file rather than as the thing it is.
          rm -f .skip_*_hook
          exit 0

      # Two engines, one prompt. Which one runs is `vars.AGENT_ENGINE`
      # (`claude-code`, the default, or `opencode`); everything on either side
      # of this pair is identical, because the engine only ever sees a working
      # tree and leaves behind a patch and a verdict. That is the whole reason
      # the agent call was kept to a single step with the prompt in a file.
      #
      # Neither engine's own GitHub Action is used. OpenCode ships one, but it
      # is driven by `/opencode` comments on issues and pull requests and opens
      # the pull request itself — both of which this workflow deliberately does
      # not do: comment triggers carry someone else's text into an agent's
      # context, and opening the pull request here would put a write credential
      # in the job the agent runs in. Installing the CLI keeps the three-job
      # split intact.
      # The counterpart to the key check on the OpenCode side. Without it a
      # missing secret still fails the run, but as an authentication error from
      # inside a third-party action — which reads like the model rejected the
      # request rather than like a repository setting nobody made. The two
      # engines should be equally clear about the same mistake.
      - name: Check the Claude key is present
        if: needs.detect.outputs.engine == 'claude-code' && steps.regenerate.outputs.recovered != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::AGENT_ENGINE is 'claude-code' but the ANTHROPIC_API_KEY secret is not set. Add it, or switch AGENT_ENGINE to an engine this repository has a key for."
            exit 1
          fi
          echo "The Claude key is present."

      - name: Run the agent (Claude Code)
        if: needs.detect.outputs.engine == 'claude-code' && steps.regenerate.outputs.recovered != 'true'
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1.0.222
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only, and only so the action can resolve repository context.
          # The job's `permissions:` block is what actually bounds it.
          github_token: ${{ github.token }}
          # The instructions live in a plain Markdown file, not in this YAML and
          # not in `.claude/skills/`: a prompt in a file is reviewable on its
          # own, diffable, and portable to another engine. This input only
          # points at it.
          prompt: |
            Read `.github/agent-prompts/repair-build.md` and carry out exactly
            the task it describes. It is the complete specification, including
            which paths you may change and what counts as done.
          # Commands are enumerated, never wildcarded on the tool name. This
          # Makefile's targets include `release`, `release-frb`, `publish`,
          # `update-changelog` and `setup-repo-protections`, so `Bash(make:*)`
          # would admit all of them. The push at the end of `make release` would
          # fail for want of a credential — but only after it had already
          # bumped `pubspec.yaml` in the working tree, and `pubspec.yaml` is
          # inside the path allowlist, so a version bump would ride along in the
          # pull request looking like part of the fix. `cargo` is enumerated for
          # the same reason: `cargo publish` and `cargo install` live under the
          # same prefix as `cargo check`.
          #
          # `Write` is granted so the agent can leave its verdict. It can also
          # create source files anywhere, which the path allowlist is what
          # actually contains — the grant does not.
          #
          # `ls` and `rg` are deliberately absent. `Glob` and `Grep` do the same
          # work and are scoped to the workspace, whereas `rg` reads any path
          # the process can — `/proc/self/environ` included, which is where this
          # job's secrets live. This raises the bar rather than sealing it: the
          # agent may edit the Makefile and then run `make`, so treat the
          # enumeration as one control among several and not as a sandbox. The
          # ones that actually hold are the absent write credential, the path
          # allowlist, and the secret scan below.
          claude_args: |
            --model ${{ needs.detect.outputs.model }}
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(make get),Bash(make build),Bash(make codegen),Bash(make test),Bash(make test:*),Bash(make analyze),Bash(make analyze:*),Bash(make format),Bash(make format-check),Bash(make rust-check),Bash(make rust-clippy),Bash(make rust-test),Bash(make doc),Bash(make rust-doc),Bash(cargo check:*),Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo tree:*),Bash(cargo metadata:*),Bash(git log:*),Bash(git status:*)"
            --disallowedTools "WebFetch,WebSearch"

      # Pinned, and `npm` rather than the vendor's curl installer so the version
      # is a lockable input rather than whatever `latest` resolved to that
      # morning. `OPENCODE_DISABLE_AUTOUPDATE` matters for the same reason: an
      # agent that upgrades itself mid-run is not the agent that was reviewed.
      - name: Install OpenCode
        if: needs.detect.outputs.engine == 'opencode' && steps.regenerate.outputs.recovered != 'true'
        env:
          AGENT_OPENCODE_VERSION: ${{ vars.AGENT_OPENCODE_VERSION || '1.18.15' }}
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${AGENT_OPENCODE_VERSION}"
          opencode --version

      # The permissions live in `.github/agent-config/opencode.json`, which is
      # outside the path allowlist so the agent cannot widen them and have the
      # change ride along in the pull request. That file is the counterpart to
      # the `--allowedTools` line above and carries the reasoning for each rule.
      #
      # `--auto` is deliberately absent: it auto-approves everything not
      # explicitly denied, which is the opposite of an allowlist. The config
      # denies by default instead, and never uses `ask` — a question in a
      # headless run has nobody to answer it.
      #
      # The turn limit is `steps` in that config, not a flag here; OpenCode has
      # no `--max-turns`. On exhaustion it forces a text-only response, so the
      # agent cannot call `write`, so `verdict.json` is missing, so the step
      # below fails loudly — the same outcome as Claude Code running out of
      # turns, reached by a different route.
      - name: Run the agent (OpenCode)
        if: needs.detect.outputs.engine == 'opencode' && steps.regenerate.outputs.recovered != 'true'
        env:
          # Which provider the key belongs to is configuration, not code. Every
          # provider OpenCode knows about reads its key from its own environment
          # variable — `OPENROUTER_API_KEY`, `AI_GATEWAY_API_KEY`,
          # `ANTHROPIC_API_KEY`, and so on — so the *name* is the variable and
          # the value is one secret. Pointing this workflow at a different
          # provider, a self-hosted gateway or a proxy is then two repository
          # settings rather than a YAML edit repeated in every generated
          # project and shipped through a template release.
          # The key is looked up under the provider's own name first, so a
          # repository that already has `OPENROUTER_API_KEY` for the CHANGELOG
          # automation does not need a second copy of the same value under a
          # second name. `scripts/src/ai_client.dart` reads the provider-named
          # variable directly and that is right — it is how every provider
          # documents itself — so the duplication is removed here rather than by
          # bending that.
          #
          # `secrets.AGENT_OPENCODE_API_KEY` still wins when set, which keeps a repo
          # free to hold a separate key for the agent than for the CHANGELOG
          # writer — different blast radius, and someone may want that.
          #
          # If neither resolves, the guard below stops the run rather than
          # letting OpenCode start without credentials.
          AGENT_OPENCODE_PROVIDER_ENV: ${{ vars.AGENT_OPENCODE_PROVIDER_ENV || 'OPENROUTER_API_KEY' }}
          AGENT_OPENCODE_API_KEY: ${{ secrets.AGENT_OPENCODE_API_KEY || secrets[vars.AGENT_OPENCODE_PROVIDER_ENV || 'OPENROUTER_API_KEY'] }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/agent-config/opencode.json
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          # Model is engine-scoped on purpose: `AGENT_CLAUDECODE_MODEL` names a
          # Claude model and means nothing to OpenCode, so each engine reads its
          # own variable and a stale setting for the other cannot be picked up
          # by mistake.
          #
          # The assignment below is load-bearing and was missing. The `run:`
          # block references `$AGENT_OPENCODE_MODEL` under `set -u`, so without
          # it this step died with "unbound variable" before OpenCode was ever
          # invoked. The comment describing the variable was here; the variable
          # was not. Nothing caught it because this workflow has never run in
          # CI, and the bench runs passed `--model` on the command line by hand.
          # The default was measured, not picked from a leaderboard. Seven
          # models ran the same real failure three or more times each, scored on
          # whether they returned `cannot-fix` and left the tree untouched:
          #
          #   gpt-5.6-luna      6/6   ~$0.006/run
          #   glm-5.2           4/4   ~$0.43
          #   sonnet-5          3/3   ~$0.48
          #   gpt-5.6-luna-pro  3/3   ~$0.033
          #   deepseek-v4-flash 1/3   ~$0.05
          #   deepseek-v4-pro   1/5   ~$0.08
          #   claude-haiku-4-5  0/3   ~$0.22
          #
          # The four that fell short all failed the same way: they diagnosed the
          # flaky runner correctly and then raised the failing test's timeout,
          # each explaining why that was not really weakening it. `test/**` is
          # inside the path allowlist, so nothing downstream would have caught
          # that — only the prompt stands there, and they walked through it.
          # Public coding benchmarks did not predict this: deepseek-v4-pro is
          # among the strongest open-weight agentic coders by published score.
          #
          # Context still matters and still constrains the choice: the prompt
          # invites the agent to open the full log, capped at 400 KB, roughly
          # 130K tokens of CI output on top of the working context. A model with
          # a 128K window would serve every ordinary run and fail on exactly the
          # unfamiliar failure the full log exists for. This one has 1M.
          #
          # Note the price is promotional at the time of measuring; expect it to
          # roughly double. That changes nothing here — it would still be the
          # cheapest model that held the bar, by an order of magnitude.
          AGENT_OPENCODE_MODEL: ${{ needs.detect.outputs.model }}
        run: |
          set -euo pipefail

          # Two documented channels for handing OpenCode a configuration other
          # than the file this workflow points at: `OPENCODE_PERMISSION`
          # replaces the permission block, `OPENCODE_CONFIG_CONTENT` supplies a
          # whole config as a string. Nothing here sets either, and only someone
          # who could edit this file could — but this is the job where the agent
          # holds `write`, `edit` and a `make` allowlist, so the assertion below
          # is worth making against inputs that are closed rather than merely
          # unused. `unset` on an unset name is not an error under `set -u`.
          unset OPENCODE_PERMISSION OPENCODE_CONFIG_CONTENT

          if [ -z "${AGENT_OPENCODE_API_KEY:-}" ]; then
            echo "::error::AGENT_ENGINE is 'opencode' but no provider key resolved. Set the AGENT_OPENCODE_API_KEY secret, or a secret named '${AGENT_OPENCODE_PROVIDER_ENV}' to match AGENT_OPENCODE_PROVIDER_ENV."
            exit 1
          fi

          # The name comes from a repository variable, so only someone who
          # could edit this workflow can set it — but a typo would otherwise
          # produce an export that fails in a way that reads like an OpenCode
          # bug rather than a settings mistake. Checking it costs one line.
          if ! printf '%s' "$AGENT_OPENCODE_PROVIDER_ENV" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "::error::AGENT_OPENCODE_PROVIDER_ENV ('${AGENT_OPENCODE_PROVIDER_ENV}') is not a valid environment variable name."
            exit 1
          fi

          # Hand the key to whichever variable this provider reads. `export` is
          # given a single NAME=VALUE string and never evaluates it, so the
          # secret cannot be re-parsed as shell here.
          export "${AGENT_OPENCODE_PROVIDER_ENV}=${AGENT_OPENCODE_API_KEY}"
          echo "Provider key exported as \$${AGENT_OPENCODE_PROVIDER_ENV}."

          # Assert the agent actually resolves before running it. Measured
          # against OpenCode 1.18.15: when the config is missing or does not
          # define the agent, `opencode run --agent repair-build` prints
          #
          #   ! agent "repair-build" not found. Falling back to default agent
          #
          # on stderr and then runs anyway — as the *default* agent, which has
          # no command allowlist and no step limit — and exits 0. Every control
          # this file spells out would be silently gone while the step passed.
          # A missing config is not a hypothetical: the workflow points at the
          # config inside the checked-out commit, so repairing a commit from
          # before this file existed reaches exactly that state.
          #
          # `opencode debug agent` also exits 0 when the agent is missing, so
          # the check is on its output rather than its status: a resolved agent
          # prints a JSON object whose `name` is the agent.
          #
          # And the resolved *permissions* are asserted, not just the name. That
          # check was written for `ai-review.yml` first, which was the wrong way
          # round: the reviewer has no shell and changes no file, while this
          # agent holds `write`, `edit` and the entire `make` allowlist, and the
          # allowlist in `opencode.json` is this agent's. The stronger assertion
          # belongs where the stronger grant is.
          #
          # It asserts the allowlist is exactly what the config documents.
          # Anything extra after the deny-all is a command nobody wrote down —
          # `make release`, which bumps `pubspec.yaml` inside the path
          # allowlist, is the one that would ride along in a pull request
          # looking like part of the fix. Anything *missing* is caught too: a
          # silently-narrowed allowlist is how the agent ends up unable to run
          # the gates and calling the repair done anyway.
          opencode debug agent repair-build 2>/dev/null > "$RUNNER_TEMP/agent.json" || true
          if ! python3 - "$RUNNER_TEMP/agent.json" <<'PY'
          import json, sys

          EXPECTED = {
              'make build', 'make test', 'make analyze ARGS="--fatal-infos"',
              'make format-check', 'make rust-clippy', 'make rust-test',
              'make doc', 'make rust-doc', 'make get', 'make codegen',
              'make format', 'make analyze', 'make rust-check',
              'git status', 'git diff',
          }

          try:
              data = json.load(open(sys.argv[1]))
          except Exception as exc:
              print(f"could not read the resolved agent: {exc}")
              sys.exit(1)

          if data.get('name') != 'repair-build':
              print("the resolved agent is not 'repair-build'")
              sys.exit(1)

          rules = data.get('permission', [])
          bash = [(i, r) for i, r in enumerate(rules) if r.get('permission') == 'bash']
          wildcards = [i for i, r in bash if r.get('pattern') == '*']
          if not wildcards or rules[wildcards[-1]].get('action') != 'deny':
              print("the last wildcard bash rule does not deny; every command is allowed")
              sys.exit(1)

          allowed = {
              r['pattern'] for i, r in bash
              if i > wildcards[-1] and r.get('action') == 'allow'
          }
          if allowed != EXPECTED:
              extra, missing = sorted(allowed - EXPECTED), sorted(EXPECTED - allowed)
              if extra:
                  print(f"commands allowed that this workflow does not expect: {extra}")
              if missing:
                  print(f"commands this workflow expects that are not allowed: {missing}")
              sys.exit(1)

          def verdict(tool):
              last = None
              for r in rules:
                  if r.get('permission') == tool and r.get('pattern') == '*':
                      last = r.get('action')
              return last

          undenied = [t for t in ('task', 'webfetch', 'websearch',
                                  'external_directory')
                      if verdict(t) != 'deny']
          if undenied:
              print(f"these tools do not resolve to deny for the repair agent: {undenied}")
              sys.exit(1)

          print(f"repair permissions resolve as intended: {len(allowed)} commands, exactly the documented set.")
          PY
          then
            echo "::error::The 'repair-build' agent did not resolve from ${OPENCODE_CONFIG} with the permissions this workflow expects. OpenCode falls back to its unrestricted default agent when the config is missing, and a config that resolves differently from what it reads as is worse than none — so this run is stopped instead. See the message above."
            exit 1
          fi

          opencode run \
            --agent repair-build \
            --model "$AGENT_OPENCODE_MODEL" \
            "Read \`.github/agent-prompts/repair-build.md\` and carry out exactly
             the task it describes. It is the complete specification, including
             which paths you may change and what counts as done."

      # The deterministic route reports in the same shape the agent does, so
      # that one path runs through the rest of this job instead of two. It has
      # the same two outcomes — something changed, or nothing did — and the
      # steps below care only about which.
      - name: Stand in for the verdict when nothing had to be decided
        if: steps.regenerate.outputs.recovered == 'true'
        run: |
          set -euo pipefail
          jq -n '{
            status: "fixed",
            cause: "The update workflow left this branch labelled codegen-failed: it could not run the binding generator, so what is committed under the generated paths does not correspond to the dependency version this branch pins.",
            fix: "Ran the generator. Whatever it wrote is the whole of this change; no hand-written code was touched and no model was involved.",
            surface: "unknown",
            sources: [],
            rejected: "",
            verified: ["make codegen"],
            notes: "Nothing here was decided. The generator succeeded against the new pin, which is what says the upstream API still fits this code — had it changed shape, the generator would have failed and an agent would have been asked instead. The pull requests checks are the oracle for the result."
          }' > .agent-scratch/verdict.json

      # Turn exhaustion, a crash and "there was nothing to do" all look
      # identical from outside: the job ends, the tree is clean, no pull request
      # appears. Requiring the agent to leave a verdict behind is what separates
      # them — its absence is a failure, loudly, rather than a quiet success.
      - name: Read the verdict
        id: verdict
        run: |
          set -euo pipefail
          VERDICT=.agent-scratch/verdict.json

          if [ ! -f "$VERDICT" ]; then
            echo "::error::The agent left no verdict at $VERDICT. It ran out of turns, crashed, or stopped early — this is NOT 'nothing to fix'. Check the run log."
            exit 1
          fi
          if ! jq -e . "$VERDICT" > /dev/null 2>&1; then
            echo "::error::$VERDICT is not valid JSON."
            cat "$VERDICT"
            exit 1
          fi

          STATUS=$(jq -r '.status // "missing"' "$VERDICT")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          case "$STATUS" in
            fixed)
              echo "::notice::Agent reports a fix."
              ;;
            cannot-fix)
              echo "::warning::Agent could not fix this build and said so. No pull request will be opened."
              jq -r '.cause // ""' "$VERDICT"
              jq -r '.notes // ""' "$VERDICT"
              ;;
            *)
              echo "::error::Unrecognised verdict status '$STATUS' (expected 'fixed' or 'cannot-fix')."
              exit 1
              ;;
          esac

          # Kept for both outcomes, not just a fix. `cannot-fix` is the verdict
          # that gets reported to a person, so its text has to survive the
          # scratch directory being deleted — and has to reach the secret scan
          # below, which used to run only on the way to a pull request.
          cp "$VERDICT" "$RUNNER_TEMP/verdict.json"

      # The check that would have caught the only pull request this workflow
      # has ever opened. That one made a red build green by editing a GENERATED
      # file — one line, `codegenVersion`, silencing a consistency check rather
      # than removing its cause — and it compiled, it passed the tests, and it
      # reached a human. An AI reviewer caught it; nothing deterministic did.
      #
      # This is the same two-line rule `codegen-guard.yml` applies to a human's
      # pull request, applied here instead to an agent's work, before it leaves
      # the job. Staging first is what makes it exact: with the agent's tree in
      # the index, `git diff` against the worktree shows what the GENERATOR
      # changed and nothing else.
      #
      # A generator that now fails is the same finding by a different route —
      # the agent left the sources in a state nothing can generate from — and
      # it fails here rather than three platforms later.
      - name: Refuse generated files that were not generated
        if: steps.verdict.outputs.status == 'fixed'
        run: |
          set -euo pipefail
          git add -A -- lib/src/rust/ rust/src/frb_generated.rs

          if ! make codegen > "$RUNNER_TEMP/codegen-recheck.log" 2>&1; then
            tail -60 "$RUNNER_TEMP/codegen-recheck.log"
            echo "::error::The binding generator fails on the repaired tree. Whatever else is true of this change, nothing can be generated from it — so it cannot be what a reviewer is shown."
            exit 1
          fi

          rm -f .skip_*_hook
          DRIFT=$(git diff --name-only -- lib/src/rust/ rust/src/frb_generated.rs)
          if [ -n "$DRIFT" ]; then
            printf '%s\n' "$DRIFT"
            git --no-pager diff --stat -- lib/src/rust/ rust/src/frb_generated.rs
            echo "::error::Regenerating moved these files, which means what the agent left there was not what the generator produces. A generated file edited by hand is overwritten by the next codegen run, so a build made green this way was never repaired. Nothing is uploaded."
            exit 1
          fi
          echo "The generated files are what the generator produces."

      # Whether this package's own API moved — measured, not asked.
      #
      # The boundary this whole mode turns on is "is the missing value in scope,
      # or only at the caller?", and the observable half of the answer is
      # whether a parameter appeared in the generated Dart. The agent states its
      # own view in `surface`; this step decides what the pull request is
      # LABELLED, because a rule a script can check should not be left to a
      # model. The two are compared and a disagreement is reported rather than
      # resolved silently.
      #
      # Line-based, and deliberately. An earlier draft compared whole
      # declarations and would have been wrong on the very cases it was written
      # for: the generator writes one parameter per line, so a new required
      # parameter is a pure ADDITION and no existing declaration line ever
      # disappears. Comment lines are dropped because a docstring is not a
      # surface — measured against the three real upstream changes in this
      # repository's history, that distinction alone is what separates the one
      # that was not breaking from the two that were.
      - name: Decide whether this package's own API moved
        id: surface
        if: steps.verdict.outputs.status == 'fixed'
        run: |
          set -euo pipefail

          git diff HEAD -U0 -- 'lib/src/rust/api/' > "$RUNNER_TEMP/api.diff" 2>/dev/null || true

          MOVED=$( { grep -E '^[+-]' "$RUNNER_TEMP/api.diff" || true; } \
                   | { grep -Ev '^(\+\+\+|---)' || true; } \
                   | sed -E 's/^[+-][[:space:]]*//' \
                   | { grep -Ev '^(///|//|$)' || true; } )

          if [ -n "$MOVED" ]; then
            echo "surface=moved" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$MOVED" | head -40 > "$RUNNER_TEMP/surface.txt"
            echo "::warning::The generated Dart API moved — this repair widens or changes what consumers of this package call."
            cat "$RUNNER_TEMP/surface.txt"
          else
            echo "surface=unchanged" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/surface.txt"
            echo "The generated Dart API is unchanged apart from comments."
          fi

          # `unknown` is what the deterministic route writes, and it is not a
          # disagreement — nothing claimed anything there.
          CLAIMED=$(jq -r '.surface // "unstated"' "$RUNNER_TEMP/verdict.json")
          DISAGREED=false
          case "$CLAIMED" in
            unknown|unstated) ;;
            unchanged) [ -n "$MOVED" ] && DISAGREED=true ;;
            widened)   [ -z "$MOVED" ] && DISAGREED=true ;;
            *) DISAGREED=true ;;
          esac
          echo "disagreed=$DISAGREED" >> "$GITHUB_OUTPUT"
          if [ "$DISAGREED" = true ]; then
            echo "::warning::The agent called the surface '${CLAIMED}' and the generated bindings say otherwise. The measurement decides what this is labelled; the disagreement is reported to whoever reads it."
          fi

      - name: Reduce the work to a patch
        id: patch
        if: steps.verdict.outputs.status == 'fixed'
        env:
          RECOVERED: ${{ steps.regenerate.outputs.recovered }}
        run: |
          set -euo pipefail
          rm -rf .agent-scratch

          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/repair.patch"

          if [ ! -s "$RUNNER_TEMP/repair.patch" ]; then
            # The deterministic route is allowed to find nothing: the bindings
            # were already what the generator produces and the label was simply
            # never removed. Removing it is then the whole of the repair, and
            # `commit` still has something to do. An AGENT reporting `fixed`
            # having changed nothing is the original contradiction and still
            # fails — one of the two statements is wrong and neither is safe to
            # act on.
            if [ "${RECOVERED:-}" = "true" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::The generator produced nothing new — the bindings were already correct. The stale label is the whole of the repair."
              exit 0
            fi
            echo "::error::The agent reported 'fixed' but changed nothing. One of the two is wrong, and neither is safe to act on."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only

      # The allowlist, enforced here rather than trusted to the prompt. Two
      # exclusions carry their own reason and are not incidental:
      #
      #   .github/**   — the cheapest way to turn a red build green is to weaken
      #                  what reported it. That change has to be a human's.
      #   .githooks/** — carries an executable bit, which the signed-commit API
      #                  cannot represent; the push would be rejected anyway.
      - name: Reject changes outside the allowlist
        if: steps.verdict.outputs.status == 'fixed'
        env:
          ALLOWED: '^(rust|lib|test|hook|scripts|example)/|^(Makefile|pubspec\.yaml|analysis_options\.yaml)$'
        run: |
          set -euo pipefail
          OUTSIDE=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::The agent changed files outside the allowlist:"
            printf '%s\n' "$OUTSIDE"
            exit 1
          fi
          echo "All changed paths are inside the allowlist."

          # Inside the allowlist by path, and refused anyway. Two reasons, and
          # the second applies on `main` as much as on an update branch:
          #
          #   In mode=pr the new pin is the PREMISE of the failure. Backing it
          #   out is not a repair; it is a refusal of the update wearing one,
          #   and it would arrive looking like a fix.
          #
          #   In either mode, the notice inventory is generated from the
          #   resolved dependency graph and `THIRD_PARTY_NOTICES.txt` is outside
          #   the allowlist — so an agent that moves the graph cannot regenerate
          #   what verifies it, and produces a change that CANNOT go green. A
          #   refusal here is a `cannot-fix` with a reason; the alternative is a
          #   pull request that fails a bookkeeping check nobody can explain.
          MANIFEST=$(git diff --cached --name-only \
                     | grep -E '^rust/Cargo\.(toml|lock)$' || true)
          if [ -n "$MANIFEST" ]; then
            printf '%s\n' "$MANIFEST"
            echo "::error::The repair changes the dependency manifest or lockfile. That is not a repair this workflow can complete: the notice inventory generated from the dependency graph is outside the paths an agent may change, so the result could never pass its own checks."
            exit 1
          fi

      # This repository is public, so its Actions logs, pull-request bodies and
      # issues are public. The verdict is free text an agent wrote after reading
      # a build log that third parties contribute to, and it is copied verbatim
      # into whatever gets published — created through the API, which never
      # passes through the log masking that would otherwise catch a secret. That
      # is an exfiltration path with a public endpoint, and it is the one
      # control gh-aw would have supplied and this workflow has to supply for
      # itself.
      #
      # Runs for BOTH verdicts. It used to be `fixed` only, from when a pull
      # request was the only thing this workflow could publish; `cannot-fix` now
      # reaches a public issue by the same route, carrying the same text, so it
      # needs the same check. A scan that covers only one of two publication
      # paths is the shape of control that reads as present and is not.
      #
      # Fails rather than redacts. A secret appearing here at all means
      # something went wrong upstream of this step, and quietly publishing a
      # censored version of it would hide that.
      - name: Refuse to publish anything carrying a secret
        env:
          SCAN_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Resolved the same way the agent step resolves it. If this only read
          # `secrets.AGENT_OPENCODE_API_KEY` it would scan nothing whenever the key
          # came from the provider-named fallback — which is the common case for
          # a repository that already had `OPENROUTER_API_KEY` — and a key could
          # reach a public pull-request body unscanned.
          SCAN_AGENT_OPENCODE_API_KEY: ${{ secrets.AGENT_OPENCODE_API_KEY || secrets[vars.AGENT_OPENCODE_PROVIDER_ENV || 'OPENROUTER_API_KEY'] }}
          SCAN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FOUND=0
          # Every engine's key is scanned regardless of which engine ran: the
          # loop skips empty values, so listing both costs nothing and means
          # adding an engine can never quietly leave a key unscanned. Note this
          # scans the secret's *value*, so it keeps working whatever provider
          # `AGENT_OPENCODE_PROVIDER_ENV` pointed that value at.
          for name in SCAN_ANTHROPIC_API_KEY SCAN_AGENT_OPENCODE_API_KEY SCAN_GITHUB_TOKEN; do
            value="${!name}"
            [ -n "$value" ] || continue
            for file in "$RUNNER_TEMP/verdict.json" "$RUNNER_TEMP/repair.patch" "$RUNNER_TEMP/surface.txt"; do
              # The patch exists only on the `fixed` path; the verdict always
              # does. Skipping what is absent is what lets one scan serve both
              # outcomes without a second copy of it under a different `if`.
              [ -f "$file" ] || continue
              # -q and -F: the needle is a secret, so it is matched literally and
              # never echoed. Only the variable's name is ever printed.
              if grep -qF -- "$value" "$file"; then
                echo "::error::$(basename "$file") contains the value of ${name#SCAN_}. Nothing will be uploaded or published."
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" != 0 ]; then
            exit 1
          fi
          echo "Nothing due for publication carries a known secret."

      - name: Upload the patch
        if: steps.verdict.outputs.status == 'fixed'
        uses: actions/upload-artifact@v7
        with:
          name: repair-patch
          path: |
            ${{ runner.temp }}/repair.patch
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/surface.txt
          retention-days: 7
          if-no-files-found: error

      # A separate artifact rather than a condition on the one above, so the
      # `propose` job's download is untouched by any of this: it still asks for
      # `repair-patch` and still gets exactly the two files it always got.
      - name: Upload the verdict
        if: steps.verdict.outputs.status == 'cannot-fix'
        uses: actions/upload-artifact@v7
        with:
          name: repair-verdict
          path: ${{ runner.temp }}/verdict.json
          retention-days: 7
          if-no-files-found: error

      # Written for every outcome, including the failures above, because the
      # question this answers is "did the automation look, and what did it
      # decide" — and that question is asked exactly when something did not go
      # to plan. Until this existed the only way to answer it was to open the
      # job and read its log.
      #
      # `always()` covers the steps that exit non-zero. When the run failed
      # before a verdict existed, the summary says so rather than rendering an
      # empty table, since an empty table reads like "nothing happened".
      - name: Summarise the attempt
        if: always()
        env:
          ENGINE: ${{ needs.detect.outputs.engine }}
          MODEL: ${{ needs.detect.outputs.model }}
          RUN_URL: ${{ needs.detect.outputs.run_url }}
          SHA: ${{ needs.detect.outputs.sha }}
          STATUS: ${{ steps.verdict.outputs.status }}
          MODE: ${{ needs.detect.outputs.mode }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          RECOVERED: ${{ steps.regenerate.outputs.recovered }}
          SURFACE: ${{ steps.surface.outputs.surface }}
          DISAGREED: ${{ steps.surface.outputs.disagreed }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/verdict.json"

          {
            echo "## Build repair"
            echo
            echo "| | |"
            echo "|---|---|"
            if [ "${MODE:-main}" = "pr" ]; then
              echo "| Subject | #${PR_NUMBER}, committing to its own branch |"
            else
              echo "| Subject | \`main\`, proposing a pull request |"
            fi
            echo "| Broken commit | \`${SHA:0:12}\` |"
            echo "| Failing run | ${RUN_URL:-none — the tree was the evidence} |"
            if [ "${RECOVERED:-}" = "true" ]; then
              echo "| Settled by | regenerating the bindings — no model ran |"
            else
              echo "| Agent | \`${ENGINE:-unknown}\` / \`${MODEL:-unknown}\` |"
            fi
            echo "| Verdict | ${STATUS:-**none — the run did not get that far**} |"
            if [ -n "${SURFACE:-}" ]; then
              echo "| This package's Dart API | \`${SURFACE}\`${DISAGREED:+ — and the agent said otherwise} |"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$V" ]; then
            {
              echo "The agent left no verdict. That is a failure rather than"
              echo "\"nothing to fix\" — read the job log above for where it stopped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Through jq from the file, never through a workflow expression:
          # these fields are text a model wrote, and an expression is evaluated
          # by the runner before the shell ever sees it. (The literal expression
          # syntax cannot be written even inside this comment — actionlint parses
          # run scripts for it.) Bounded for the same reason the
          # pull-request body is — a rehearsal produced ~3500 characters of
          # `notes`, and a step summary has a 1 MB cap that a runaway field
          # could reach on its own.
          field() {
            jq -r --arg f "$1" '((.[$f] // "") | tostring) | if length == 0 then "_(not stated)_" elif length > 3000 then .[0:3000] + "\n\n_(truncated)_" else . end' "$V"
          }

          {
            echo "### What broke"
            echo
            field cause
            echo
            if [ "${STATUS:-}" = "fixed" ]; then
              echo "### What the agent changed"
              echo
              field fix
              echo
              echo "### Gates it says it ran"
              echo
              jq -r '(.verified // []) | if type != "array" or length == 0 then "_(none reported)_" else map("- `" + tostring + "`") | join("\n") end' "$V"
            else
              echo "### Why it stopped"
              echo
              echo "No pull request was opened, and that is the intended outcome when"
              echo "the fix is not the agent's to make — a flaky runner, a change"
              echo "outside the allowlist, or a failure that does not reproduce."
            fi
            echo
            echo "### Notes"
            echo
            field notes
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # The only job that can write. The agent does not run here.
  # ==========================================================================
  propose:
    name: Open the pull request
    needs: [detect, repair]
    # mode=main only. A repair on a bot's branch has a pull request already —
    # the one that is red — and opening a second one against `main` would
    # propose the dependency update and the adaptation to it as somebody else's
    # change, leaving the original still red and still blocked.
    if: >-
      needs.detect.outputs.mode == 'main' &&
      needs.detect.outputs.dry_run != 'true' &&
      needs.repair.outputs.status == 'fixed' &&
      needs.repair.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Two deliberate choices here.
      #
      # The App token, matching the update workflows: a pull request opened by
      # the default GITHUB_TOKEN does not trigger workflows, which would leave
      # this one without the four-platform matrix that is its entire oracle —
      # and a missing oracle looks exactly like a passing one.
      #
      # `main`, not the pinned SHA the agent worked on. `detect` established the
      # two were equal, but a commit can land while the agent runs, and cutting
      # the branch from the older tree would make this pull request revert it.
      # If main really did move and the patch no longer applies, `git apply`
      # below fails loudly — the correct outcome, since the fix was reasoned
      # about against a tree that no longer exists.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: repair-patch
          path: ${{ runner.temp }}/repair

      - name: Apply the patch
        run: |
          set -euo pipefail
          # Staged, and left staged: `git diff --cached --name-only` is then the
          # same question the repair job answered, asked the same way. Unstaging
          # would force the check onto `git status` output, which does not
          # survive renames or a path with a space in it.
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/repair/repair.patch"
          git diff --cached --stat

      # Re-checked after the round trip. The artifact is written and read by
      # this workflow alone, so this is not a trust boundary — it is a cheap
      # assertion that the patch that arrived is the patch that was vetted.
      - name: Re-check the allowlist
        env:
          ALLOWED: '^(rust|lib|test|hook|scripts|example)/|^(Makefile|pubspec\.yaml|analysis_options\.yaml)$'
        run: |
          set -euo pipefail
          OUTSIDE=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Patch touches files outside the allowlist after apply:"
            printf '%s\n' "$OUTSIDE"
            exit 1
          fi

      # Written to a file rather than interpolated into the action's `body:`.
      # The verdict is text an agent wrote, and text an agent wrote must never
      # reach a `${{ }}` expression — that is evaluated by the runner before the
      # shell ever sees it.
      - name: Compose the pull request body
        env:
          RUN_URL: ${{ needs.detect.outputs.run_url }}
          SHA: ${{ needs.detect.outputs.sha }}
          # Resolved once in `detect` and carried through, so the pull request
          # names what actually ran. Reading `vars` here instead would name
          # whatever is configured at review time rather than at repair time.
          AGENT_ENGINE_USED: ${{ needs.detect.outputs.engine }}
          AGENT_MODEL_USED: ${{ needs.detect.outputs.model }}
        run: |
          set -euo pipefail
          VERDICT="$RUNNER_TEMP/repair/verdict.json"

          # Bounded. These fields are free text an agent wrote, they are copied
          # into a body that is public, and a rehearsal produced a `notes` of
          # ~3500 characters. A cap keeps the pull request readable and keeps an
          # unbounded public write from being one field away.
          field() {
            jq -r --arg f "$1" --arg fallback "$2" '
              ((.[$f] // "") | tostring) as $v
              | if ($v | length) == 0 then $fallback
                elif ($v | length) > 4000 then ($v[0:4000] + "\n\n_(truncated)_")
                else $v end' "$VERDICT"
          }

          {
            echo "## Automated build repair"
            echo
            echo "CI on \`main\` was red at \`${SHA:0:12}\`. This pull request is an"
            echo "agent's proposed fix, and it has not been reviewed by anyone."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Failing run | $RUN_URL |"
            echo "| Written by | \`${AGENT_ENGINE_USED:-unknown}\` / \`${AGENT_MODEL_USED:-unknown}\` |"
            echo "| Broken commit | \`$SHA\` |"
            echo
            echo "### What the agent says broke"
            echo
            field cause "(not stated)"
            echo
            echo "### What it changed"
            echo
            field fix "(not stated)"
            echo
            echo "### Verified locally before opening this"
            echo
            # Defensive on shape as well as absence: `verified` is written by a
            # model, and a bare string where an array belongs would otherwise
            # abort jq and fail the run at the last step, after the work is done.
            jq -r '(.verified // []) | if type != "array" or length == 0 then "(nothing reported)" else map("- `" + tostring + "`") | join("\n") end' "$VERDICT"
            echo
            echo "### Notes"
            echo
            field notes "(none)"
            echo
            echo "---"
            echo
            echo "**Review this as a proposal, not a result.** The agent ran the gates above on"
            echo "Linux only; the matrix on this pull request is the real check. Confirm that the"
            echo "change addresses the cause rather than the symptom, and that no test was"
            echo "weakened to make it pass."
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Required: the Signing commit ruleset applies to ~ALL branches with
          # no bypass actors, so an unsigned push is rejected.
          sign-commits: true
          branch: ${{ needs.detect.outputs.branch }}
          base: main
          commit-message: |
            fix(ci): repair the build broken at ${{ needs.detect.outputs.sha }}
          title: "Repair the build broken at ${{ needs.detect.outputs.sha }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            automated
          draft: false

  # ==========================================================================
  # mode=pr's write job: a commit on the branch that is already red, and the
  # pull request that is already open gets told what happened. No agent here.
  # ==========================================================================
  commit:
    name: Commit the repair to the branch
    needs: [detect, repair]
    # Deliberately NOT gated on `changed`. The deterministic route is allowed
    # to find nothing to write — the bindings were already correct and the
    # `codegen-failed` label was simply never removed — and removing that label
    # is then the whole of the repair.
    if: >-
      needs.detect.outputs.mode == 'pr' &&
      needs.detect.outputs.dry_run != 'true' &&
      needs.repair.outputs.status == 'fixed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The commit the agent reasoned about, not whatever the branch is now.
      # `detect` established the two were equal and `expectedHeadOid` below
      # re-asserts it at the moment of writing, so somebody pushing while this
      # ran loses nothing: this fails instead.
      #
      # `persist-credentials: false` although no agent runs here — nothing in
      # this job needs a credential in `.git/config`, because the commit is
      # made through the API rather than by pushing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: repair-patch
          path: ${{ runner.temp }}/repair

      - name: Apply the patch
        id: apply
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/repair/repair.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to commit — the stale label is the repair."
            exit 0
          fi
          # Staged, and left staged, for the reason the `propose` job gives:
          # `git diff --cached --name-only` is then the same question the repair
          # job answered, asked the same way.
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/repair/repair.patch"
          git diff --cached --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Re-checked after the round trip, exactly as `propose` re-checks it. Not
      # a trust boundary — this workflow wrote and read the artifact — but a
      # cheap assertion that the patch that arrived is the patch that was
      # vetted, and this is the one path that writes to a branch rather than to
      # a pull request nobody has merged yet.
      - name: Re-check the allowlist
        if: steps.apply.outputs.changed == 'true'
        env:
          ALLOWED: '^(rust|lib|test|hook|scripts|example)/|^(Makefile|pubspec\.yaml|analysis_options\.yaml)$'
        run: |
          set -euo pipefail
          OUTSIDE=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Patch touches files outside the allowlist after apply:"
            printf '%s\n' "$OUTSIDE"
            exit 1
          fi
          MANIFEST=$(git diff --cached --name-only | grep -E '^rust/Cargo\.(toml|lock)$' || true)
          if [ -n "$MANIFEST" ]; then
            echo "::error::Patch touches the dependency manifest or lockfile after apply. On this branch that pin is the premise of the failure, not its cause."
            exit 1
          fi

      - name: Commit it, signed, onto the branch
        id: push
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.detect.outputs.branch }}
          EXPECTED: ${{ needs.detect.outputs.sha }}
          RECOVERED: ${{ needs.repair.outputs.recovered }}
          SURFACE: ${{ needs.repair.outputs.surface }}
          ENGINE: ${{ needs.detect.outputs.engine }}
          MODEL: ${{ needs.detect.outputs.model }}
        run: |
          set -euo pipefail

          # `createCommitOnBranch`, and neither of the two obvious alternatives.
          #
          # Not a push: the signing ruleset covers ~ALL branches with no bypass
          # actor, so an unsigned commit is rejected wherever this lands, and
          # nothing in a runner can sign as anybody. Commits made through this
          # mutation are signed by GitHub itself; ones made through the git-data
          # API are not.
          #
          # Not `peter-evans/create-pull-request`, which was the obvious reuse
          # and is the wrong tool here: it maintains a branch as "base plus the
          # diff", so pointing it at an existing branch resets away the commit
          # the update bot made — the one this entire pull request is about —
          # and it would need a force push to do it, which the same ruleset
          # refuses on every branch but `dependabot/**`.
          #
          # `expectedHeadOid` is the whole concurrency story: the write is
          # conditional on the branch still being where the agent found it.
          if [ "$RECOVERED" = "true" ]; then
            KIND="regenerate"
            HEADLINE="chore(bindings): regenerate what the update workflow could not"
          elif [ "$SURFACE" = "moved" ]; then
            KIND="agent"
            HEADLINE="feat(api)!: adapt to the upstream change, widening this package's API"
          else
            KIND="agent"
            HEADLINE="fix(api): adapt to the upstream change this branch pins"
          fi

          if [ "$KIND" = "regenerate" ]; then
            WROTE="Generated by \`make codegen\`. No model was involved and no hand-written code was touched."
          else
            WROTE="Written by \`${ENGINE}\` / \`${MODEL}\`, unreviewed. Read it as a proposal."
          fi

          # The marker the deduplication reads, and the one a future
          # auto-close-superseded-pull-requests job has to read too: a commit
          # made with the App token is authored by the same bot as the branch's
          # own commits, so "every commit here is the bot's" stays true and
          # cannot distinguish a branch an agent has worked on. This line, and
          # the `agent-repaired` label below, are what can.
          BODY=$(printf '%s\n\nRepairing the failure recorded against %s.\n\nrepair-build: %s (%s)\n' \
                   "$WROTE" "$EXPECTED" "$EXPECTED" "$KIND")

          python3 - "$HEADLINE" "$BODY" > "$RUNNER_TEMP/payload.json" <<'PY'
          import base64, json, os, subprocess, sys

          headline, body = sys.argv[1], sys.argv[2]

          QUERY = (
              "mutation($input: CreateCommitOnBranchInput!) {"
              "  createCommitOnBranch(input: $input) { commit { oid url } }"
              "}"
          )

          # `--no-renames`: a rename arrives as `R100<TAB>old<TAB>new`, three
          # fields where every other status has two, and the mutation has no
          # notion of one anyway. Split into a deletion and an addition it is
          # unambiguous.
          out = subprocess.run(
              ['git', 'diff', '--cached', '--name-status', '--no-renames'],
              capture_output=True, text=True, check=True).stdout

          additions, deletions = [], []
          for line in out.splitlines():
              status, _, path = line.partition('\t')
              if not path:
                  continue
              if status.startswith('D'):
                  deletions.append({'path': path})
              else:
                  with open(path, 'rb') as fh:
                      additions.append({'path': path,
                                        'contents': base64.b64encode(fh.read()).decode()})

          print(json.dumps({
              'query': QUERY,
              'variables': {'input': {
                  'branch': {'repositoryNameWithOwner': os.environ['GH_REPO'],
                             'branchName': os.environ['BRANCH']},
                  'expectedHeadOid': os.environ['EXPECTED'],
                  'message': {'headline': headline, 'body': body},
                  'fileChanges': {'additions': additions, 'deletions': deletions},
              }},
          }))
          PY

          gh api graphql --input "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/commit.json"

          # `gh api` exits 0 on a GraphQL response that carries `errors`, so the
          # status is not the answer. A missing oid is.
          OID=$(jq -r '.data.createCommitOnBranch.commit.oid // ""' "$RUNNER_TEMP/commit.json")
          if [ -z "$OID" ]; then
            jq -r '.errors[]?.message // empty' "$RUNNER_TEMP/commit.json"
            echo "::error::The commit was not created. If the branch moved while this ran, that is the expected outcome and the next scheduled run will look again."
            exit 1
          fi
          echo "oid=$OID" >> "$GITHUB_OUTPUT"
          echo "::notice::Committed ${OID:0:12} onto ${BRANCH}."

      # Labels are created before they are applied. `gh pr edit --add-label`
      # fails on a label the repository does not have, and a repository
      # generated from this template has neither of these until the first time
      # this workflow needs one.
      - name: Make sure the labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create agent-repaired --repo "$GH_REPO" --force \
            --color B60205 \
            --description "An agent committed to this branch; the change is a proposal nobody has confirmed" > /dev/null
          gh label create needs-decision --repo "$GH_REPO" --force \
            --color D93F0B \
            --description "Waiting on a human decision, not on more work" > /dev/null

      - name: Say what was done, on the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          SHA: ${{ needs.detect.outputs.sha }}
          NEW_OID: ${{ steps.push.outputs.oid }}
          CHANGED: ${{ steps.apply.outputs.changed }}
          RECOVERED: ${{ needs.repair.outputs.recovered }}
          SURFACE: ${{ needs.repair.outputs.surface }}
          DISAGREED: ${{ needs.repair.outputs.surface_disagreed }}
          ENGINE: ${{ needs.detect.outputs.engine }}
          MODEL: ${{ needs.detect.outputs.model }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/repair/verdict.json"

          # Through jq from the file, never through a workflow expression:
          # these fields are text a model wrote, and an expression is evaluated
          # by the runner before the shell ever sees it. Bounded for the reason
          # the pull-request body is bounded — a rehearsal produced ~3500
          # characters of `notes`.
          field() {
            jq -r --arg f "$1" --arg fallback "$2" '
              ((.[$f] // "") | tostring) as $v
              | if ($v | length) == 0 then $fallback
                elif ($v | length) > 4000 then ($v[0:4000] + "\n\n_(truncated)_")
                else $v end' "$V"
          }

          # The marker `detect` reads, and the KIND is load-bearing rather than
          # descriptive: a regeneration that wrote nothing leaves a comment on
          # an unmoved head, and that must not suppress a later model attempt on
          # the same commit — it decided nothing.
          if [ "$RECOVERED" = "true" ]; then
            KIND="regenerate"
          else
            KIND="agent"
          fi

          {
            echo "<!-- repair-build:${SHA}:${KIND} -->"
            if [ "$RECOVERED" = "true" ]; then
              echo "## The bindings have been regenerated"
              echo
              echo "This branch was labelled \`codegen-failed\`: the update workflow could not"
              echo "run the binding generator, so what was committed under the generated paths"
              echo "did not correspond to the version this branch pins. **No model was"
              echo "involved** — the generator ran, and whatever it wrote is the whole of the"
              echo "change."
            else
              echo "## An agent adapted this branch to its own update"
              echo
              echo "The failure here is an upstream change of shape, which is the one thing a"
              echo "dependency update cannot carry by itself. This commit is an agent's"
              echo "proposal and **nobody has reviewed it**."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            if [ "$CHANGED" = "true" ]; then
              echo "| Commit | \`${NEW_OID:0:12}\` |"
            else
              echo "| Commit | none — nothing needed writing |"
            fi
            echo "| Repairing | \`${SHA:0:12}\` |"
            if [ "$RECOVERED" = "true" ]; then
              echo "| Written by | \`make codegen\` |"
            else
              echo "| Written by | \`${ENGINE}\` / \`${MODEL}\` |"
            fi
            echo "| This package's Dart API | \`${SURFACE}\` (measured from the generated bindings) |"
            echo

            if [ "$SURFACE" = "moved" ]; then
              echo "### This widens the public API, so it is a breaking change"
              echo
              echo "The value this adaptation needed does not exist anywhere inside this"
              echo "package — it can only come from the caller — so the API has to grow a"
              echo "parameter, and every consumer's code changes with it. The whole change is"
              echo "prepared here: the Rust side, the Dart side, the tests, the documentation"
              echo "and the CHANGELOG entry."
              echo
              echo "**Two things are left, and both are yours:** confirm that widening the API"
              echo "is the right answer, and choose the version number when this is released."
              echo "Nothing here sets a version, and merging this releases nothing."
              echo
              echo "What moved, in the generated bindings:"
              echo
              echo '```diff'
              head -c 3000 "$RUNNER_TEMP/repair/surface.txt" 2>/dev/null || true
              echo '```'
              echo
            fi

            if [ "$DISAGREED" = "true" ]; then
              echo "> [!WARNING]"
              echo "> The agent's own account of whether the API moved disagrees with what the"
              echo "> generated bindings say. The measurement decides the label above; the"
              echo "> disagreement is left here because which way it went is worth knowing"
              echo "> before trusting the rest of the account."
              echo
            fi

            echo "### What broke"
            echo
            field cause "(not stated)"
            echo
            echo "### What changed"
            echo
            field fix "(not stated)"
            echo
            echo "### What was rejected, and why"
            echo
            field rejected "_(nothing recorded — read the change the more carefully for it)_"
            echo
            echo "### Where each new value came from"
            echo
            jq -r '(.sources // []) | if type != "array" or length == 0
                     then "_(no value had to be supplied)_"
                     else map("- `" + ((.value // "?") | tostring) + "` ← " + ((.origin // "?") | tostring)) | join("\n")
                     end' "$V"
            echo
            echo "### Verified before committing"
            echo
            jq -r '(.verified // []) | if type != "array" or length == 0 then "(nothing reported)" else map("- `" + tostring + "`") | join("\n") end' "$V"
            echo
            echo "### Notes"
            echo
            field notes "(none)"
            echo
            echo "---"
            echo
            echo "The checks on this pull request are the oracle; they run against the commit"
            echo "above exactly as they would against anybody's. A green matrix says the change"
            echo "compiles and passes, not that the adaptation is the right one — and on this"
            echo "kind of change those are different questions. The one to ask is whether the"
            echo "values it threaded through are the values upstream meant."
          } > "$RUNNER_TEMP/comment.md"

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/comment.md"

      - name: Label what this now is
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          SURFACE: ${{ needs.repair.outputs.surface }}
          CODEGEN_FAILED: ${{ needs.detect.outputs.codegen_failed }}
        run: |
          set -euo pipefail

          ADD=()
          # Always, and it is not decoration. A future job that closes bot pull
          # requests superseded by a newer one is planned to gate on "every
          # commit here is the bot's" — which a commit made with the App token
          # satisfies, because it IS the bot's. This label is how that job can
          # tell a branch an agent has worked on from one it has not, and an
          # agent-repaired branch carries reasoning nobody has confirmed: it is
          # exactly the one that must not close itself.
          ADD+=(--add-label agent-repaired)

          if [ "$SURFACE" = "moved" ]; then
            ADD+=(--add-label needs-decision)
          fi

          # Removed only here, and only after the repair job re-ran the
          # generator and found its output already in the tree. The label means
          # "the bindings do not correspond to this pin"; dropping it while that
          # was still true would turn a required check green over a tree nobody
          # had regenerated.
          if [ "$CODEGEN_FAILED" = "true" ]; then
            ADD+=(--remove-label codegen-failed)
          fi

          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" "${ADD[@]}"
          echo "::notice::#${PR_NUMBER}: ${ADD[*]}"

      # The permanent record of a breaking change is the commit message that
      # reaches the default branch, and with a squash merge that message is the
      # PULL REQUEST TITLE rather than any commit on the branch. A title the
      # update bot wrote says "update X to vY" and carries no mark, so a change
      # that alters every consumer's code would land looking like a version
      # bump. This is the one edit that cannot be made after the fact.
      #
      # Conservative on purpose: a title that already marks a breaking change is
      # left alone, and the mark is inserted into whatever convention the title
      # already follows rather than a second prefix being stacked in front of it.
      - name: Mark the title breaking when the API moved
        if: needs.repair.outputs.surface == 'moved'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -euo pipefail
          TITLE=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json title --jq '.title')

          case "$TITLE" in
            *'!:'*)
              echo "::notice::The title already marks a breaking change — leaving it."
              exit 0
              ;;
          esac

          if printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?: '; then
            NEW=$(printf '%s' "$TITLE" | sed -E 's/^([a-z]+(\([^)]*\))?): /\1!: /')
          else
            NEW="feat!: $TITLE"
          fi

          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --title "$NEW"
          echo "::notice::Retitled #${PR_NUMBER} to: $NEW"

  # ==========================================================================
  # The other job that can write, for the other outcome. No agent here either.
  # ==========================================================================
  report:
    name: Report a build the agent could not fix
    needs: [detect, repair]
    # mode=main only. On a bot's branch the same verdict becomes a comment on
    # the pull request that is already open — see `remark` below.
    if: >-
      needs.detect.outputs.mode == 'main' &&
      needs.detect.outputs.dry_run != 'true' &&
      needs.repair.outputs.status == 'cannot-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # `cannot-fix` is the outcome this workflow reaches most often, and until
    # now it produced a warning annotation on a green run: no pull request, no
    # notification, nothing that reaches anyone not already reading Actions.
    # Measured on this repository, `main` went red four times in five weeks and
    # every one was a flaky runner — which is to say the agent's usual and
    # correct answer was the one nobody was told about.
    #
    # An issue rather than a failed run. A red daily job for a condition that
    # resolves itself is how people learn to ignore a workflow, and the agent
    # declining to act is not an error — it is the behaviour the prompt asks
    # for. An issue also carries the diagnosis, which is the part worth having.
    #
    # The App token cascades events where `GITHUB_TOKEN` would not, so opening
    # this issue can trigger workflows. Nothing here listens to issues, and that
    # is deliberate: `repair-build.yml` takes no issue trigger precisely so that
    # text written into an issue cannot reach an agent's context.
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: repair-verdict
          path: ${{ runner.temp }}/verdict

      # Written to a file rather than interpolated into an expression. The
      # verdict is text an agent wrote after reading a build log, and text an
      # agent wrote must never reach a `${{ }}` — that is evaluated by the
      # runner before the shell ever sees it. It has already been scanned for
      # secrets in the job that produced it.
      - name: Compose the issue
        env:
          RUN_URL: ${{ needs.detect.outputs.run_url }}
          SHA: ${{ needs.detect.outputs.sha }}
          ENGINE: ${{ needs.detect.outputs.engine }}
          MODEL: ${{ needs.detect.outputs.model }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/verdict/verdict.json"

          field() {
            jq -r --arg f "$1" '((.[$f] // "") | tostring) | if length == 0 then "_(not stated)_" elif length > 4000 then .[0:4000] + "\n\n_(truncated)_" else . end' "$V"
          }

          {
            echo "<!-- repair-build:${SHA} -->"
            echo "CI on \`main\` was red at \`${SHA:0:12}\`. An agent looked at the failure"
            echo "and reported that the fix is not one it should make. **No pull request was"
            echo "opened**, and nothing in the repository was changed."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Failing run | ${RUN_URL:-unknown} |"
            echo "| Broken commit | \`${SHA}\` |"
            echo "| Looked at by | \`${ENGINE:-unknown}\` / \`${MODEL:-unknown}\` |"
            echo
            echo "### What it says broke"
            echo
            field cause
            echo
            echo "### Why it stopped"
            echo
            field notes
            echo
            echo "---"
            echo
            echo "This is a diagnosis, not a conclusion. The agent is told to stop rather"
            echo "than guess, and the commonest reason it stops here is a flaky runner —"
            echo "in which case re-running the failed job is the whole of the fix, and this"
            echo "issue can be closed. It also stops when the real fix lies outside the"
            echo "paths it may change, which \`.github/**\` deliberately is."
          } > "$RUNNER_TEMP/issue.md"

      # One issue per broken commit, matching how the pull-request path is keyed
      # by the same SHA. The marker rather than the title is what identifies it,
      # because a title is prose and prose gets edited. `--state all` for the
      # same reason the pull-request check uses it: a closed issue means someone
      # has already read this exact failure, and re-filing it every night is how
      # automation teaches people to stop reading it.
      #
      # Listed and filtered here rather than handed to `--search`. Two reasons,
      # and the second is the one that bites: GitHub's search index is eventually
      # consistent, so an issue filed minutes ago can be missing from it and the
      # next run would file a duplicate — and `repair-build:<sha>` reads as a
      # search *qualifier* because of the colon, so the query would not mean what
      # it looks like either. `gh pr list --head` on the other side is a direct
      # query for the same reason.
      - name: File the issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail

          # Piped to jq rather than using `--jq`: the marker has to go in as
          # `--arg`, which is a jq flag and not one gh forwards.
          EXISTING=$(gh issue list --repo "$GH_REPO" --state all --limit 100 \
            --label automated --json number,body \
            | jq -r --arg marker "repair-build:${SHA}" \
                'map(select(.body | contains($marker))) | first | .number // empty')

          if [ -n "$EXISTING" ]; then
            echo "::notice::An issue for ${SHA:0:12} already exists (#${EXISTING}) — leaving it alone."
            exit 0
          fi

          NUMBER=$(gh issue create --repo "$GH_REPO" \
            --title "Build red at ${SHA:0:12} and the agent could not fix it" \
            --body-file "$RUNNER_TEMP/issue.md" \
            --label automated)
          echo "::warning::Filed ${NUMBER}"

  # ==========================================================================
  # mode=pr's other outcome. The agent declined; the pull request is told so,
  # where the person who will read it already is. No agent here either.
  # ==========================================================================
  remark:
    name: Say why the branch was not repaired
    needs: [detect, repair]
    if: >-
      needs.detect.outputs.mode == 'pr' &&
      needs.detect.outputs.dry_run != 'true' &&
      needs.repair.outputs.status == 'cannot-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # A comment rather than an issue, which is the whole difference from
    # `report`. A red bot pull request already has a page where somebody will
    # look, and filing a separate issue about it would split one subject across
    # two places and leave the issue outliving the branch.
    #
    # It is also the deduplication key: `detect` refuses to select a head that
    # already carries a comment marked with its SHA, so this is said once per
    # head commit rather than once a night.
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: repair-verdict
          path: ${{ runner.temp }}/verdict

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          SHA: ${{ needs.detect.outputs.sha }}
          RUN_URL: ${{ needs.detect.outputs.run_url }}
          ENGINE: ${{ needs.detect.outputs.engine }}
          MODEL: ${{ needs.detect.outputs.model }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/verdict/verdict.json"

          field() {
            jq -r --arg f "$1" '((.[$f] // "") | tostring) | if length == 0 then "_(not stated)_" elif length > 4000 then .[0:4000] + "\n\n_(truncated)_" else . end' "$V"
          }

          {
            # `:agent` — a model looked at this head and declined. That is what
            # stops the same commit being handed to a model again tomorrow.
            echo "<!-- repair-build:${SHA}:agent -->"
            echo "## This was looked at and not repaired"
            echo
            echo "An agent read the failure on \`${SHA:0:12}\` and reported that the fix is not"
            echo "one it should make. **Nothing was committed to this branch.**"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Failing run | ${RUN_URL:-none — the evidence was the tree} |"
            echo "| Looked at by | \`${ENGINE:-unknown}\` / \`${MODEL:-unknown}\` |"
            echo
            echo "### What it says broke"
            echo
            field cause
            echo
            echo "### Why it stopped"
            echo
            field notes
            echo
            echo "### What it considered and rejected"
            echo
            field rejected
            echo
            echo "---"
            echo
            echo "This is a diagnosis, not a conclusion — and on this branch the commonest"
            echo "honest reason to stop is that the adaptation needs a decision rather than"
            echo "more work. The other common ones are a flaky runner, in which case"
            echo "re-running the failed job is the whole of the fix, and a cause that lies"
            echo "outside the paths an agent may change, which \`.github/**\` deliberately is."
            echo
            echo "This will not be repeated for this commit. Pushing to the branch re-arms it."
          } > "$RUNNER_TEMP/comment.md"

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/comment.md"
          echo "::notice::Commented on #${PR_NUMBER}."

  # ==========================================================================
  # Housekeeping: retire the reports whose subject has gone away.
  # ==========================================================================
  resolve:
    name: Close reports for a build that is green again
    needs: detect
    # `inputs.dry_run` directly rather than `needs.detect.outputs.dry_run`: that
    # output is only written on the branch where a target was selected, so on
    # the path this job runs on it is always empty. Without this, dispatching a
    # rehearsal while `main` is green would quietly close issues — a write
    # nobody asked the rehearsal to make. On a scheduled run `inputs` is empty,
    # so the guard costs nothing there.
    #
    # `main_conclusion`, not `broken`. These issues are filed about a red
    # `main` and are retired when `main` goes green, and "no target was
    # selected" stopped being the same statement as "main is green" the moment
    # `detect` learned to select a pull request instead: a run that picks a red
    # bot branch on a perfectly green `main` would otherwise leave the reports
    # about `main` open forever.
    if: needs.detect.outputs.main_conclusion != 'failure' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only here on purpose. The listing below runs on this token; the
      # App token is minted only if something actually needs closing, so the
      # ordinary green day mints no write credential at all.
      issues: read

    # The `report` job files an issue when the agent declines to fix a red
    # `main`. Most of those resolve without anyone doing anything — the failure
    # was a flaky runner and the next run is green — and an issue that outlives
    # its subject is how a useful signal turns into a list nobody reads.
    #
    # Two filters decide what this touches, and either would be enough alone:
    # the `automated` label, which only this workflow applies, and the
    # `repair-build:` marker in the body, which a person would never write.
    # Measured against this repository: `gh issue list` does not return pull
    # requests at all (49 of them carry the `automated` label and none appear),
    # and no human-filed issue here carries a label of any kind.
    #
    # An issue somebody has picked up is left alone. Closing something a person
    # commented on or assigned to themselves would be a bot overruling them on a
    # judgement it is not making — this job only knows that the symptom went
    # away, not that the work is done.
    steps:
      - name: Find reports that can be retired
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ISSUES=$(gh issue list --repo "$GH_REPO" --state open --limit 100 \
            --label automated --json number,body,comments,assignees)

          # `comments == 0 && assignees == 0` rather than "no comment from a
          # human": measured, `gh issue list` returns `author.is_bot` as null on
          # issue comments, so telling a person from a bot there would mean
          # matching a login, and a login is a thing that changes. This workflow
          # never comments on the issues it files — the diagnosis is the body —
          # so any comment at all is somebody else, which is the question being
          # asked anyway.
          CLOSE=$(jq -r '[.[] | select(.body | contains("repair-build:"))
                             | select((.comments | length) == 0 and (.assignees | length) == 0)
                             | .number] | @csv' <<<"$ISSUES")
          HELD=$(jq -r '[.[] | select(.body | contains("repair-build:"))
                            | select((.comments | length) > 0 or (.assignees | length) > 0)
                            | .number] | @csv' <<<"$ISSUES")

          echo "close=$CLOSE" >> "$GITHUB_OUTPUT"

          if [ -n "$HELD" ]; then
            echo "::notice::Leaving #${HELD} open — somebody has commented on or been assigned to them, so closing is not this job's call."
          fi
          if [ -z "$CLOSE" ]; then
            echo "Nothing to retire."
          else
            echo "Will close: $CLOSE"
          fi

      # Minted only when there is something to close, so the common case — a
      # green `main` and no open reports — never creates a write credential.
      - name: Generate GitHub App Token
        id: app-token
        if: steps.find.outputs.close != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Close them
        if: steps.find.outputs.close != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.find.outputs.close }}
          CONCLUSION: ${{ needs.detect.outputs.main_conclusion }}
        run: |
          set -euo pipefail
          # Closed with a comment rather than silently: an issue that shuts
          # itself with no explanation is worse than one that lingers.
          for n in ${NUMBERS//,/ }; do
            gh issue close "$n" --repo "$GH_REPO" \
              --comment "CI on \`main\` is green again — the latest completed \`Tests\` run concluded \`${CONCLUSION:-success}\`. Closing this automatically; nobody had picked it up. If the underlying problem is still there, reopen it." \
              --reason completed
            echo "::notice::Closed #${n}."
          done
