# Reusable test workflow for multi-platform testing
#
# Called by:
# - test.yml (on push/PR)
# - publish.yml (before publishing)
#
# Runs tests in parallel on: Linux x86_64, Linux ARM64, macOS ARM64, Windows x86_64
# Coverage: Only collected on Linux x86_64
# Badge: Updated only after ALL platform tests pass
#
# Note: Since we use `dart test` (not `flutter test`), we need to manually
# build the Rust library before running tests. FRB loads the library from
# rust/target/release/ directory automatically.

name: Test (Reusable)

on:
  workflow_call:
    inputs:
      run-coverage:
        description: 'Run coverage analysis (Linux x86_64 only)'
        type: boolean
        default: true
      update-badge:
        description: 'Update coverage badge (requires GIST_TOKEN secret)'
        type: boolean
        default: false
    secrets:
      GIST_TOKEN:
        required: false
    outputs:
      coverage-percentage:
        description: 'Coverage percentage (from Linux x86_64 run)'
        value: ${{ jobs.test.outputs.coverage }}

# Least-privilege default: jobs only read the repo unless they opt into more.
permissions:
  contents: read

jobs:
  # ============================================
  # Security Audit (Rust dependencies)
  # ============================================
  audit:
    name: Security Audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust tools
        run: make setup-rust-tools

      - name: Run cargo audit
        run: make rust-audit

  # ============================================
  # Supply-chain policy (licenses, bans, sources, advisories)
  # ============================================
  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust tools
        run: make setup-rust-tools

      - name: Run cargo deny
        run: make rust-deny

  # ============================================
  # Minimum supported Rust version
  # ============================================
  # `rust-version` in rust/Cargo.toml is a promise to anyone building the native
  # library from source. Untested, it silently becomes false the first time a
  # dependency or a language feature raises the real floor, and the failure then
  # lands on a contributor rather than here. The version is read from the
  # manifest rather than written twice, so the job cannot drift from the claim it
  # is checking.
  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' rust/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::rust/Cargo.toml declares no rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Type-check on the declared MSRV
        run: make rust-check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            coverage: true
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            coverage: false
          - os: macos-latest
            name: macOS ARM64
            coverage: false
          - os: windows-latest
            name: Windows x86_64
            coverage: false

    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - uses: actions/checkout@v7

      # Install make (Windows only, pre-installed on Linux/macOS)
      - name: Setup Make
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-make

      # Deliberately `stable` (the action's default) rather than a pinned
      # version, unlike the MSRV job above. A new stable can redden this job
      # with nobody having changed a line — `make rust-clippy` below runs with
      # warnings as errors, so one new clippy lint is enough. That is accepted
      # here and not elsewhere because a clippy regression cannot reach a
      # consumer: it changes nothing that gets published, it fails at exactly
      # one step, and the fix is usually the line clippy names. Pinning would
      # trade that for lint debt that accrues silently and is far more
      # expensive to pay off in one go later.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Get dependencies
        run: make get
        shell: bash

      # Build Rust library - FRB loads from rust/target/release/ automatically
      - name: Build Rust library
        run: make build
        shell: bash

      # Lint hand-written Rust with clippy (warnings = errors). Runs once, on
      # Linux x86_64: clippy is a full check-compile of the native library and
      # its findings are platform-independent for this portable FRB glue, so
      # repeating it on every matrix leg (Windows especially) would multiply CI
      # time for no extra signal. The clippy component ships with the rustup
      # toolchain set up above — nothing extra to install.
      - name: Rust clippy
        if: matrix.name == 'Linux x86_64'
        run: make rust-clippy
        shell: bash

      # Crate-level unit tests. Same single-leg rationale as clippy above: these
      # assert platform-independent invariants, including any test cited as the
      # justification for an advisory ignore in .cargo/audit.toml or deny.toml.
      - name: Rust unit tests
        if: matrix.name == 'Linux x86_64'
        run: make rust-test
        shell: bash

      # The Web target is compiled by nothing else in this workflow: `make
      # build` is host-only, so without this step a change that breaks the
      # wasm32 build reaches a release tag before anyone finds out.
      - name: Setup web build tools
        if: matrix.name == 'Linux x86_64'
        run: make setup-web
        shell: bash

      - name: Build WASM
        if: matrix.name == 'Linux x86_64'
        run: make build-web
        shell: bash

      # The only step in this workflow that EXECUTES web code. Everything else
      # here is the Dart VM or a compile, and a `cfg(target_arch = "wasm32")`
      # body is a different implementation of the same function rather than the
      # same code on another host — so a green native suite is no evidence
      # about it.
      #
      # chromedriver is resolved from the runner image and never downloaded.
      # wasm-pack fetches the LATEST chromedriver when it finds none on $PATH,
      # which is an unpinned network dependency in every CI run — that, and not
      # a version mismatch, is why this fails closed rather than falling back.
      # A mismatch is not known to bite loudly, so a green run is no evidence
      # the driver matched. Nor does --chromedriver pin the BROWSER: with no
      # webdriver.json and no WASM_BINDGEN_TEST_WEBDRIVER_JSON this job runs on
      # the image's Chrome, whichever that is.
      - name: Rust unit tests (browser)
        if: matrix.name == 'Linux x86_64'
        run: |
          set -euo pipefail
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            driver="${CHROMEWEBDRIVER}/chromedriver"
          elif command -v chromedriver >/dev/null 2>&1; then
            driver="$(command -v chromedriver)"
          else
            echo "::error::no preinstalled chromedriver on this runner; refusing to let wasm-pack fetch an unpinned one"
            exit 1
          fi
          echo "using $driver ($("$driver" --version))"
          make test-web CHROMEDRIVER="$driver"
        shell: bash

      - name: Analyze
        run: make analyze ARGS="--fatal-infos"
        shell: bash

      - name: Check formatting
        run: make format-check
        shell: bash

      # Deployment-target consistency (iOS/macOS/Android min versions across the
      # CI build env vars, example Xcode projects and README). Platform-independent, so it
      # runs once on Linux x86_64 (like clippy). Fails on drift (exit 1); fix with
      # `make check-targets ARGS="--ios --set X.Y"` (or --macos/--android).
      - name: Check deployment targets
        if: matrix.name == 'Linux x86_64'
        run: make check-targets
        shell: bash

      # Documentation gate. The Dart surface in `lib/src/rust/` is generated
      # from the Rust docstrings in `rust/src/api/`, so a reference written in
      # Rust syntax (`[`Type::method`]`) is copied verbatim and reaches pub.dev
      # as a dead link that nothing else catches. BLOCKING: dartdoc_options.yaml
      # promotes `unresolved-doc-reference` to an error, so this step fails the
      # build rather than reporting. Same single-leg rationale as clippy above —
      # dartdoc reads only Dart sources, so the result is platform-independent.
      #
      # NOTE what it does NOT catch: a reference in plain backticks resolves
      # nothing and so never warns. The gate proves every `[...]` reference
      # points at a real symbol; it cannot prove the prose names the right one.
      - name: Check documentation
        if: matrix.name == 'Linux x86_64'
        run: make doc
        shell: bash

      # The other half of the documentation gate, and the half `make doc`
      # structurally cannot see: intra-doc links in the parts of `rust/src/`
      # that stay in Rust — private items, module headers, anything not copied
      # out to Dart. BLOCKING: the Makefile runs it under
      # `RUSTDOCFLAGS=-D warnings`, so a broken `[...]` link fails the build
      # instead of printing a warning nobody reads.
      #
      # ⚠ It is placed after the web steps rather than beside clippy because
      # its wasm32 leg needs the target that `make setup-web` installs above.
      # Two legs, because `cfg(target_arch = "wasm32")` modules are invisible
      # to the host run: each documents a tree the other cannot compile.
      - name: Check Rust documentation
        if: matrix.name == 'Linux x86_64'
        run: make rust-doc
        shell: bash

      # Run tests without coverage (non-Linux or coverage disabled)
      - name: Run tests
        if: matrix.coverage == false || !inputs.run-coverage
        run: make test
        shell: bash

      # Coverage only on Linux x86_64 when enabled
      - name: Install lcov
        if: matrix.coverage == true && inputs.run-coverage
        run: sudo apt-get install -y lcov

      - name: Run tests with coverage
        if: matrix.coverage == true && inputs.run-coverage
        run: make coverage

      - name: Calculate coverage percentage
        if: matrix.coverage == true && inputs.run-coverage
        id: coverage
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | sed 's/.*: //' | sed 's/%.*//')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"
        shell: bash

      # ── Bookkeeping gates, last on purpose ──────────────────────────────
      #
      # These check committed files against the dependency graph rather than
      # exercising any code, and they are placed after everything that does
      # because a step failing takes every step after it with it. Run early,
      # a stale notice inventory means the Dart suite never runs at all on
      # this leg — and the inventory goes stale on EVERY dependency bump,
      # which is exactly the pull request whose code most needs testing. The
      # bookkeeping failure is real and still fails the job; it just no
      # longer decides whether the tests get to report.
      #
      # Both stay on one leg: they read committed files, so all four legs
      # would read the same bytes and reach the same answer. Linux x86_64 is
      # the one that also runs coverage, so nothing else is waiting on it.

      # The notice inventory is generated from the resolved dependency graph, so
      # any dependency change invalidates it. Verified once, on Linux x86_64:
      # the generator unions every release target regardless of the host.
      - name: Verify third-party notices
        if: matrix.name == 'Linux x86_64'
        run: make verify-third-party-notices
        shell: bash

      - name: Verify FRB pins agree
        if: matrix.name == 'Linux x86_64'
        run: make verify-frb-pins
        shell: bash

  # ============================================
  # Update coverage badge (after ALL tests pass)
  # ============================================
  update-badge:
    name: Update Coverage Badge
    needs: test
    if: inputs.update-badge && inputs.run-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ needs.test.outputs.coverage }}%
          valColorRange: ${{ needs.test.outputs.coverage }}
          minColorRange: 50
          maxColorRange: 90
