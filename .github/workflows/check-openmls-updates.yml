# Automatically check for new openmls releases and create PR with all updates
#
# This workflow:
# 1. Runs daily (or manually) to check for new openmls releases
# 2. Compares with current upstream dependency version in rust/Cargo.toml
# 3. If newer version found:
#    - Updates rust/Cargo.toml with new openmls version
#    - Runs cargo update to update Cargo.lock
#    - Regenerates FRB bindings (make codegen)
#    - Updates CHANGELOG.md with AI-generated entry (provider per AI_MODELS)
#    - Creates a PR with all changes

name: Check openmls Updates

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version is the same'
        required: false
        default: false
        type: boolean
      target_version:
        description: 'Specific version to update to (leave empty for latest)'
        required: false
        default: ''
        type: string
      dry_run:
        description: >-
          Report which superseded update pull requests would be closed, and
          close none. Defaults to ON for a manual run: this is the input a
          human reaches for to see what the rule does, and a rehearsal that
          closes somebody's pull request is not a rehearsal. Scheduled runs
          close for real.
        required: false
        default: true
        type: boolean

jobs:
  check-updates:
    runs-on: ubuntu-26.04
    # All writes (checkout push, PR creation, branch push) go through the App
    # token; the default GITHUB_TOKEN needs no write access here.
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The App token minted above is deliberately NOT passed to this checkout,
      # and `persist-credentials: false` keeps even the default GITHUB_TOKEN out
      # of `.git/config`. Later steps in this same job run repository code and
      # third-party tooling (make get, make setup-frb-codegen, make codegen),
      # and keeping the token out of the worktree means none of that can read a
      # write-scoped credential. The pull request is pushed by
      # peter-evans/create-pull-request, which takes the token as an input and
      # needs no persisted credentials; the gh steps read it from GH_TOKEN.
      # Mirrors refresh-notices.yml. This checkout runs on the job's default
      # GITHUB_TOKEN, which `permissions: contents: read` scopes to a read of
      # this repository — enough whether it is public or private — so the App
      # token is not needed here at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Check for updates
        id: check
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          # Quota, not access — openmls/openmls is public. An unauthenticated
          # call is capped at 60/hour counted per *source IP*, and hosted
          # runners share theirs, so this step can be refused with a 403 that
          # reads like a permission problem, on a schedule nobody controls. The
          # job's own read-only token gives it a quota of its own.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Build arguments
          ARGS="--ci"

          if [ -n "$TARGET_VERSION" ]; then
            # Manual input is interpolated into ARGS and reaches a make recipe's
            # shell before the Dart checker sees it, so it is held here to
            # characters a shell reads literally. Whether it is a well-formed pin
            # for this project's upstream source is the checker's call
            # (`validatePin` in scripts/src/upstream_source.dart): one rule per
            # source, in one place, rather than a copy of each in this file.
            if [[ ! "$TARGET_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._/+-]{0,127}$ ]]; then
              echo "::error::target_version may contain only letters, digits and . _ / + -"
              exit 2
            fi
            ARGS="$ARGS --version $TARGET_VERSION"
          fi

          if [ "$FORCE_UPDATE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: make check-new-openmls-version ARGS=\"$ARGS\""
          # `|| true` is unavoidable, and the exit code is unusable as a signal:
          # the checker exits 1 for "update available", and GNU make collapses any
          # non-zero recipe status into its own exit 2 (verified: a recipe exiting
          # 1 makes `make` exit 2), so 2 cannot be told apart from a crash.
          make check-new-openmls-version ARGS="$ARGS" || true

          # What can tell them apart is the outputs file: the checker writes it
          # before signalling, and not at all when it throws. Without this gate a
          # broken checker (rate limit, API change, network) looks exactly like
          # "already up to date" and the workflow stays green forever while
          # silently never opening another update PR.
          if ! grep -q '^needs_update=' "$GITHUB_OUTPUT"; then
            echo "::error::Update checker wrote no result — it failed before reporting. Check the step log above; do NOT read this as 'up to date'."
            exit 1
          fi

          echo "Check completed. Outputs:"
          cat "$GITHUB_OUTPUT" || true

      # Idempotency gate: if an open PR for this exact version already exists,
      # do nothing. Without this, every scheduled run regenerates the update
      # (cargo update + AI changelog are not byte-deterministic) and
      # force-pushes the PR branch — adding daily noise commits and wiping any
      # manual commits pushed to the PR. force_update bypasses the gate.
      - name: Check for existing update PR
        id: existing
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          BRANCH="update-openmls-${LATEST_VERSION}"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" != "0" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open update PR for branch $BRANCH already exists — skipping to avoid force-pushing over it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update rust/Cargo.toml
        id: cargo-toml
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          # Same call as the check step, same reason — see the note there.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Build arguments for update
          ARGS="--update --ci"

          if [ -n "$TARGET_VERSION" ]; then
            # Manual input is interpolated into ARGS and reaches a make recipe's
            # shell before the Dart checker sees it, so it is held here to
            # characters a shell reads literally. Whether it is a well-formed pin
            # for this project's upstream source is the checker's call
            # (`validatePin` in scripts/src/upstream_source.dart): one rule per
            # source, in one place, rather than a copy of each in this file.
            if [[ ! "$TARGET_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._/+-]{0,127}$ ]]; then
              echo "::error::target_version may contain only letters, digits and . _ / + -"
              exit 2
            fi
            ARGS="$ARGS --version $TARGET_VERSION"
          fi

          if [ "$FORCE_UPDATE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: make check-new-openmls-version ARGS=\"$ARGS\""
          if make check-new-openmls-version ARGS="$ARGS"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::error::Failed to update rust/Cargo.toml"
          fi

      - name: Setup Rust
        id: setup-rust
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-rust

      - name: Update Cargo.lock
        id: cargo-lock
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          if make rust-update; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to update Cargo.lock"
          fi

      # The minimum Rust version, raised to the highest floor a crate of the new
      # graph declares, everywhere it is stated — see `make check-msrv`. It
      # reads what crates DECLARE: a crate that uses a feature newer than its
      # own floor is invisible to it, and the pull request's MSRV job stays the
      # oracle for that. A floor raised here that still fails there reaches the
      # build repair, which leaves the manifest alone, so it ends at a person.
      # A raised floor also keeps the update from being eligible to merge
      # unread. Needs the new lock: `cargo metadata --locked` reads it.
      - name: Raise the minimum Rust version
        id: msrv
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true' && steps.cargo-lock.outputs.success == 'true'
        run: |
          if make check-msrv ARGS="--update --ci-output $GITHUB_OUTPUT"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not check the minimum Rust version"
          fi

      # What the update changed, written down for the reviewer of this pull
      # request: the release notes, the upstream range with the patches to the
      # crates this package builds, the lockfile diff, and the range of every
      # git dependency from another repository that moved — the one nothing
      # else fetches. The build repair writes the same, with the same target,
      # for its agent. Into the runner's temp directory, never the checkout:
      # the pull request step commits untracked files. Evidence, not a gate,
      # and not gated on the lock either: the index says what is missing.
      - name: Gather the update's evidence
        id: evidence
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
        run: make update-evidence ARGS="--version $LATEST_VERSION --from $CURRENT_VERSION --out $RUNNER_TEMP/update-evidence"

      - name: Upload the update's evidence
        id: evidence-upload
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-evidence
          path: ${{ runner.temp }}/update-evidence

      # The codegen binary is not preinstalled on runners; without this step
      # `make codegen` fails with exit 127 on every run. Pinned so CI and
      # local runs generate identical bindings (cached by rust-cache).
      - name: Install FRB codegen
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        run: make setup-frb-codegen

      - name: Get Dart dependencies
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        run: make get

      - name: Regenerate FRB bindings
        id: codegen
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          if make codegen; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            # Whether the FFI surface actually moved, captured as a fact the
            # CHANGELOG step and the reviewer can both rely on.
            #
            # On a plain dependency bump this should always be `unchanged`:
            # codegen reads rust/src/api, which the bump does not touch. A
            # `changed` here is therefore a tripwire — something in the
            # upstream types this crate re-exports moved — and it is also the
            # input to the stage-1 SemVer decision in `make release-frb`.
            # `git status --porcelain`, not `git diff`: codegen can add a
            # file, and `git diff` is blind to an untracked path. Reporting
            # "unchanged" there would hand the CHANGELOG prompt a false fact —
            # it is told the result is real and that it may state it.
            if [ -z "$(git status --porcelain -- lib/src/rust/)" ]; then
              echo "bindings=unchanged" >> "$GITHUB_OUTPUT"
            else
              echo "bindings=changed" >> "$GITHUB_OUTPUT"
              echo "::warning::codegen changed lib/src/rust/ — the FFI surface moved. Review before merging; the openmls_frb bump is not a patch."
            fi
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "bindings=not-run" >> "$GITHUB_OUTPUT"
            echo "::warning::FRB codegen failed. openmls API may have changed."
          fi

      # Runs AFTER codegen on purpose. The entry states whether the FFI
      # surface moved, and that has to be a result rather than a guess:
      # while this step ran first, the model had no codegen output and
      # inferred one from the phrasing of earlier entries.
      #
      # Records the openmls dependency change (openmls Highlight + Changed).
      # Does NOT touch the openmls_frb crate version — that is bumped later at
      # release time (`make release-frb`), which also stamps the frb Highlight.
      - name: Update CHANGELOG.md
        id: changelog
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        # Every key is step-scoped, as the single token before them was. These
        # may be org-level secrets shared by unrelated repositories, and a
        # job-level `env:` would hand each of them to every other step in this
        # job — including the ones that run third-party actions.
        #
        # AI_MODELS is a variable, not a secret: which model writes the entry
        # is operational configuration, and keeping it out of the code is what
        # makes a provider switch a settings change rather than a template
        # release rolled out across every generated project.
        env:
          AI_MODELS: ${{ vars.AI_MODELS }}
          AI_EFFORT: ${{ vars.AI_EFFORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          BINDINGS: ${{ steps.codegen.outputs.bindings || 'not-run' }}
          PRERELEASE: ${{ steps.check.outputs.is_prerelease }}
        run: |
          # A pre-release is never eligible to be merged unread; the script
          # records that in its verdict, which is the one place it is decided.
          PRE=""
          if [ "$PRERELEASE" = "true" ]; then PRE=" --prerelease"; fi
          if make update-changelog ARGS="--version $LATEST_VERSION --from $CURRENT_VERSION --ci --codegen $BINDINGS --ci-output $GITHUB_OUTPUT$PRE"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            # The script appends `highlights_stacked` to this same file, so read
            # it back from there rather than adding a step for it: a step cannot
            # see its own outputs, and the annotation belongs to the run that
            # produced the condition. The pull request below says the same thing
            # where a reviewer will actually meet it. The write has to precede
            # this read: move the --ci-output write later and the grep finds
            # nothing, and the warning disappears with nothing to notice.
            if grep -qx 'highlights_stacked=true' "$GITHUB_OUTPUT"; then
              echo "::warning::[Unreleased] still names more than one upstream version — it already carried several Highlights lines, and this run replaced only the first. Collapse them before releasing: make release renames the heading in place, so the section ships as it stands."
            fi
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AI changelog update failed. Please update CHANGELOG.md manually."
          fi

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: |
            chore(deps): update openmls to ${{ steps.check.outputs.latest_version }}
          title: "Update openmls to ${{ steps.check.outputs.latest_version }}"
          body: |
            ## Automated openmls Update

            This PR updates the openmls dependency version.

            ### Version Change

            | Component | Old | New |
            |-----------|-----|-----|
            | openmls | ${{ steps.check.outputs.current_version }} | ${{ steps.check.outputs.latest_version }} |

            ${{ steps.check.outputs.is_prerelease == 'true' && '> **Pre-release**: This is a release candidate. Consider waiting for stable release unless you need specific features.' || '' }}

            ${{ steps.cargo-toml.outputs.success == 'false' && '> **Critical**: Failed to update rust/Cargo.toml. Manual update required.' || '' }}

            ${{ steps.cargo-lock.outputs.success == 'false' && '> **Warning**: Failed to update Cargo.lock. Run `make rust-update` manually.' || '' }}

            ${{ steps.msrv.outputs.success == 'false' && '> **Warning**: The minimum Rust version could not be checked against the new graph. Run `make check-msrv`.' || '' }}

            ${{ steps.codegen.outputs.success == 'false' && '> **Error**: FRB codegen failed. openmls API may have changed. Manual intervention required.' || '' }}

            ${{ steps.changelog.outputs.success == 'false' && '> **Warning**: AI changelog update failed. Please update CHANGELOG.md manually.' || '' }}

            ${{ steps.changelog.outputs.success == 'true' && steps.changelog.outputs.highlights_stacked == 'true' && '> **Warning**: `[Unreleased]` still names more than one upstream version. The Highlights line states one per release section; this run replaced the first one it found, and the section already carried others. Collapse them into one before releasing: `make release` renames the heading in place, freezing the section as it stands.' || '' }}

            > **Note**: This PR does NOT bump the `openmls_frb` crate version and does NOT build native binaries. It only updates the openmls dependency. Cut a native release later with `make release-frb` (stage 1), then the Dart release (stage 2). See CLAUDE.md → Release Flow.

            ### Files Updated Automatically

            - `rust/Cargo.toml` — ${{ steps.cargo-toml.outputs.success == 'true' && 'openmls dependency versions only (the `openmls_frb` crate version is intentionally NOT bumped here)' || '**NOT UPDATED** (update failed)' }}
            - `rust/Cargo.lock` — ${{ steps.cargo-lock.outputs.success == 'true' && 'updated dependencies' || '**NOT UPDATED** (cargo update failed)' }}
            - `lib/src/rust/` — ${{ steps.codegen.outputs.success == 'true' && format('regenerated FRB bindings — FFI surface **{0}**', steps.codegen.outputs.bindings == 'changed' && 'MOVED (review: the `openmls_frb` bump is not a patch)' || 'unchanged') || '**NOT UPDATED** (codegen failed, manual update required)' }}
            - `CHANGELOG.md` — ${{ steps.changelog.outputs.success == 'true' && format('AI-generated entry (written by `{0}`)', steps.changelog.outputs.ai_provider) || '**NOT UPDATED** (AI failed, manual update required)' }}
            - `README.md` — ${{ steps.cargo-toml.outputs.success == 'true' && 'version badge' || '**NOT UPDATED**' }}
            - `.copier-answers.yml` — ${{ steps.cargo-toml.outputs.success == 'true' && 'upstream_version and upstream_crate_versions updated' || '**NOT UPDATED**' }}
            - `CLAUDE.md` — ${{ steps.cargo-toml.outputs.success == 'true' && 'example in documentation' || '**NOT UPDATED**' }}
            ${{ steps.msrv.outputs.msrv_moved == 'true' && format('- **Minimum Rust version** — raised from {0} to {1} in `rust/Cargo.toml`, the `rust_version` answer and the docs that state it: the highest floor a crate of the new graph declares', steps.msrv.outputs.msrv_from, steps.msrv.outputs.msrv_to) || '' }}

            ${{ steps.evidence-upload.outcome == 'success' && format('**Evidence**: the `update-evidence` artifact of [this run]({0}/{1}/actions/runs/{2}) holds the release notes, the upstream range with its patches to the crates this package builds, the lockfile diff, and the range of every other git dependency that moved.', github.server_url, github.repository, github.run_id) || '' }}

            ### Merge without review?

            ${{ steps.changelog.outputs.merge_eligible == 'true' && steps.changelog.outputs.success == 'true' && '**Eligible** — only version strings moved in the crates this package builds, the FFI surface held, and no third-party crate or other git dependency moved. A report, not a decision: nothing merges on it, and a merge would also need green checks and no agent commits on this branch.' || '' }}
            ${{ steps.changelog.outputs.merge_eligible == 'true' && steps.changelog.outputs.success != 'true' && '**Not eligible** — the CHANGELOG entry was not written.' || '' }}
            ${{ steps.changelog.outputs.merge_eligible == 'false' && format('**Not eligible** — {0}.', steps.changelog.outputs.merge_blockers) || '' }}
            ${{ steps.changelog.outputs.merge_eligible == '' && '**Not eligible** — the check did not run: the CHANGELOG step stopped before it.' || '' }}

            ### Release Notes

            See [openmls ${{ steps.check.outputs.latest_version }} page on crates.io](${{ steps.check.outputs.release_url }})

            ### Before Merge

            ${{ steps.cargo-toml.outputs.success == 'false' && '1. **UPDATE rust/Cargo.toml** — automatic update failed, update manually' || '' }}
            ${{ steps.cargo-lock.outputs.success == 'false' && '1. **RUN `make rust-update`** — Cargo.lock update failed' || '' }}
            1. ${{ steps.codegen.outputs.success == 'false' && '**FIX FRB BINDINGS** — codegen failed, check openmls API changes' || 'Review FRB bindings — check if API changes require Dart code updates' }}
            2. **Review CHANGELOG.md** — ${{ steps.changelog.outputs.success == 'true' && 'verify AI-generated entry is accurate' || '**ADD CHANGELOG ENTRY MANUALLY**' }}
            ${{ steps.changelog.outputs.highlights_stacked == 'true' && '1. **COLLAPSE THE HIGHLIGHTS LINES** — `[Unreleased]` names two upstream versions; that line states one per release section' || '' }}
            3. **Check if DB migration needed** — if openmls changed its storage serialization format, add a migration via `/add-db-migration` skill

            ### After Merge

            1. **Run tests locally** (optional, CI will run them):
               ```bash
               make test
               ```

            2. This update accumulates on `main` with no new native binary. When
               you are ready to ship, run the two-stage release:
               - **Stage 1 — native crate:** `make release-frb ARGS="--version X.Y.Z"`
                 (bumps `openmls_frb`, tags `openmls_frb-X.Y.Z`, builds binaries)
               - **Stage 2 — Dart package:** `make release ARGS="--version X.Y.Z"`
                 (checks the stage-1 release, bumps `pubspec.yaml`, finalizes
                 the CHANGELOG, tags `vX.Y.Z`; release-package skill)

            ---
            *This PR was created automatically by the openmls update checker.*
          branch: update-openmls-${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ steps.check.outputs.is_prerelease == 'true' && 'pre-release' || '' }}
            ${{ steps.cargo-toml.outputs.success == 'false' && 'cargo-toml-failed' || '' }}
            ${{ steps.cargo-lock.outputs.success == 'false' && 'cargo-lock-failed' || '' }}
            ${{ steps.codegen.outputs.success == 'false' && 'codegen-failed' || '' }}
            ${{ steps.changelog.outputs.success == 'false' && 'changelog-needed' || '' }}

      # Close the update pull requests this run supersedes.
      #
      # Each run updates from the version pinned on the default branch to the
      # newest one, so the newer branch carries everything an older open one
      # did, and its CHANGELOG entry covers the whole range. Left alone, the
      # older ones stay open and conflicted until somebody closes them by hand:
      # one patch release's was still open three days after the next one's had
      # replaced it.
      # This is the rule `check-template-updates.yml` applies to its own pull
      # requests, with the same four vetoes. Change the two together.
      #
      # Deliberately ORTHOGONAL to the idempotency gate above. That one asks
      # "does a pull request for THIS version already exist" and is keyed on the
      # branch name; this one asks "which OLDER ones are now pointless". So it
      # runs on that gate's skip path too: an open pull request for the newest
      # version supersedes the older ones whether this run opened it or an
      # earlier one did. It runs only while that pull request is open, so an
      # older one is never closed in favour of a version nothing proposes, and
      # only while it carries none of the labels that say its update failed
      # (`cargo-toml-failed`, `cargo-lock-failed`, `codegen-failed`): until a
      # repair clears them, an older pull request may be the update that works.
      #
      # Four vetoes, and every one of them fails toward leaving the pull request
      # open:
      #
      #   1. the branch is not `update-openmls-<version>`, its version is not
      #      a plain X.Y.Z with the same prefix as this run's, or it is not
      #      strictly older — not this job's business. A pre-release on either
      #      side is left to a person;
      #   2. it carries the `agent-repaired` label;
      #   3. one of its commits carries a `repair-build:` trailer;
      #   4. any commit on it has an author that is not a bot.
      #
      # 2 and 3 are the contract `repair-build.yml` writes down (search it for
      # "auto-close"): the repair commits with the App token, so its commits ARE
      # the bot's, and only the label and the trailer tell a repaired branch
      # from an untouched one. The trailer is matched in the COMMIT MESSAGE,
      # never in the pull request body, which embeds the CHANGELOG entry, and
      # an entry here has quoted the trailer while describing the feature.
      #
      # Closing is reversible — `gh pr reopen` — and the branch is left as it is.
      - name: Close superseded update pull requests
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REFERENCE: ${{ steps.check.outputs.latest_version }}
          BRANCH_PREFIX: update-openmls-
          # Null on a schedule, so a scheduled run closes for real; true by
          # default on the manual path. See the input's description.
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # `--head` matches a fork's branch of the same name too, and only this
          # repository's own branches are the bot's.
          gh pr list --repo "$GH_REPO" --head "${BRANCH_PREFIX}${REFERENCE}" \
            --state open --json number,labels,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)]' > "$RUNNER_TEMP/reference-pr.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/reference-pr.json")" = "0" ]; then
            echo "::notice::No open pull request proposes ${REFERENCE}; closing nothing."
            exit 0
          fi
          FAILED=$(jq -r '[.[].labels[].name
                           | select(. == "cargo-toml-failed" or . == "cargo-lock-failed"
                                    or . == "codegen-failed")] | unique | join(", ")' \
            "$RUNNER_TEMP/reference-pr.json")
          if [ -n "$FAILED" ]; then
            echo "::notice::The pull request for ${REFERENCE} is labelled ${FAILED}; older ones stay open until a repair clears it."
            exit 0
          fi

          gh pr list --repo "$GH_REPO" --state open --limit 100 \
            --json number,headRefName,labels,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)]' > "$RUNNER_TEMP/open-prs.json"

          # The decision and the act are separate on purpose. Everything below
          # this heredoc reads a file; everything inside it only reads GitHub.
          # That is what makes the rule testable against real pull requests
          # without any of them being closed to find out.
          python3 - "$REFERENCE" "$BRANCH_PREFIX" "$RUNNER_TEMP/open-prs.json" \
            "$RUNNER_TEMP/supersede.json" <<'PY'
          import json, os, re, subprocess, sys

          REFERENCE, PREFIX, PR_LIST, OUT = sys.argv[1:5]

          # A prefix, then a plain X.Y.Z and nothing after it: `v0.106.2`,
          # `0.12.0`, `release-v1.2.3`. A pre-release suffix does not match, so
          # it is never compared, on either side.
          VERSION = re.compile(r'^(\D*)(\d+)\.(\d+)\.(\d+)$')
          # Anchored to the start of a line and matched against the commit
          # message body, which is where `repair-build.yml` writes it. A loose
          # substring search matches prose quoting the trailer.
          TRAILER = re.compile(
              r'^repair-build: [0-9a-f]{7,40} \((?:agent|regenerate)\)\s*$', re.M)

          def parse(version):
              match = VERSION.match(version.strip())
              if not match:
                  return None
              return match.group(1), tuple(int(g) for g in match.groups()[1:])

          def bail(reason):
              print(f"closing nothing: {reason}")
              json.dump({'reference': REFERENCE, 'close': [], 'kept': []},
                        open(OUT, 'w'), indent=2)
              raise SystemExit(0)

          ref = parse(REFERENCE)
          if not ref:
              bail(f"the reference version {REFERENCE!r} is not a plain X.Y.Z")

          close, kept = [], []
          for pr in json.load(open(PR_LIST)):
              branch = pr.get('headRefName') or ''
              if not branch.startswith(PREFIX):
                  continue
              version = parse(branch[len(PREFIX):])
              if not version or version[0] != ref[0] or version[1] >= ref[1]:
                  continue

              entry = {'number': pr['number'], 'branch': branch}
              def keep(why):
                  kept.append(dict(entry, why=why))

              if 'agent-repaired' in {l.get('name') for l in (pr.get('labels') or [])}:
                  keep('it carries the `agent-repaired` label')
                  continue

              # Read per pull request rather than in the listing above: `gh pr
              # list` does not carry commits, and this is the one field the
              # decision cannot be made without.
              try:
                  commits = json.loads(subprocess.run(
                      ['gh', 'pr', 'view', str(pr['number']),
                       '--repo', os.environ['GH_REPO'], '--json', 'commits'],
                      capture_output=True, text=True, check=True).stdout)['commits']
              except Exception as exc:
                  keep(f'its commits could not be read ({exc})')
                  continue

              if not commits:
                  keep('it reports no commits at all')
                  continue

              if any(TRAILER.search(c.get('messageBody') or '') for c in commits):
                  keep('a commit on it carries a `repair-build:` trailer')
                  continue

              # An author with no login is not a bot either. GitHub reports one
              # for a commit whose email matches no account, which is a human
              # who pushed from a machine git was configured on differently.
              authors = [a for c in commits for a in (c.get('authors') or [])]
              humans = sorted({(a.get('login') or a.get('name') or 'an unnamed author')
                               for a in authors
                               if not (a.get('login') or '').endswith('[bot]')})
              if humans or not authors:
                  keep('it carries commits by ' + (', '.join(f'`{h}`' for h in humans)
                                                   or 'nobody this can identify'))
                  continue

              close.append(entry)

          json.dump({'reference': REFERENCE, 'close': close, 'kept': kept},
                    open(OUT, 'w'), indent=2)
          print(f"{len(close)} superseded by {REFERENCE}, {len(kept)} held back")
          PY

          {
            echo "## Superseded update pull requests"
            echo
            jq -r '
              (if (.close | length) == 0
                 then "Nothing older than `" + .reference + "` is open."
                 else "Superseded by `" + .reference + "`:\n\n"
                      + (.close | map("- #" + (.number|tostring) + " (`" + .branch + "`)") | join("\n"))
               end),
              (if (.kept | length) == 0 then empty
                 else "\nLeft open:\n\n"
                      + (.kept | map("- #" + (.number|tostring) + " (`" + .branch + "`) — " + .why) | join("\n"))
               end)' "$RUNNER_TEMP/supersede.json"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Dry run — nothing was closed._" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Dry run: $(jq -r '.close | length' "$RUNNER_TEMP/supersede.json") pull request(s) would have been closed."
            exit 0
          fi

          jq -r '.close[] | "\(.number)\t\(.branch)"' "$RUNNER_TEMP/supersede.json" \
          | while IFS=$'\t' read -r NUMBER BRANCH; do
              gh pr close "$NUMBER" --repo "$GH_REPO" --comment \
                "Superseded by the update to \`${REFERENCE}\`, which is cumulative: it updates from the version pinned on the default branch, so the newer branch carries everything this one did, and its CHANGELOG entry covers the whole range. Closed automatically because every commit here is the update bot's and nothing had been repaired or resolved on top. Reopen it if that reads wrong — the branch is untouched."
              echo "::notice::Closed #${NUMBER} (${BRANCH}) as superseded by ${REFERENCE}."
            done

      - name: Summary
        env:
          LATEST_VERSION: ${{ steps.check.outputs.latest_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          IS_PRERELEASE: ${{ steps.check.outputs.is_prerelease }}
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          SKIP_EXISTING: ${{ steps.existing.outputs.skip }}
          CARGO_TOML_OK: ${{ steps.cargo-toml.outputs.success }}
          CARGO_LOCK_OK: ${{ steps.cargo-lock.outputs.success }}
          CODEGEN_OK: ${{ steps.codegen.outputs.success }}
          CHANGELOG_OK: ${{ steps.changelog.outputs.success }}
          HIGHLIGHTS_STACKED: ${{ steps.changelog.outputs.highlights_stacked }}
        run: |
          # Each branch below interleaves its appends with conditionals, so the
          # grouped form shellcheck suggests would put a `{ ... }` around most
          # of the step. Style only — the quoting rule that actually matters
          # here (SC2086) is enforced.
          # shellcheck disable=SC2129
          if [ "$SKIP_EXISTING" = "true" ]; then
            echo "## Update PR Already Open" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "An open PR for **${LATEST_VERSION}** already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with \`force_update\` to regenerate it (this force-pushes the PR branch)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$NEEDS_UPDATE" = "true" ]; then
            echo "## Update Available" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Current openmls | ${CURRENT_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| New openmls | ${LATEST_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Pre-release | ${IS_PRERELEASE} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Cargo.toml | ${CARGO_TOML_OK} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Cargo.lock | ${CARGO_LOCK_OK} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| FRB Codegen | ${CODEGEN_OK} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| AI Changelog | ${CHANGELOG_OK} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A pull request has been created for review." >> "$GITHUB_STEP_SUMMARY"
            if [ "$CARGO_TOML_OK" = "false" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Critical**: Failed to update rust/Cargo.toml. Manual update required." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$CARGO_LOCK_OK" = "false" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Warning**: Failed to update Cargo.lock. Run \`make rust-update\` manually." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$CODEGEN_OK" = "false" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Error**: FRB codegen failed. openmls API may have changed. Manual intervention required." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$CHANGELOG_OK" = "false" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Warning**: AI changelog update failed. Please update CHANGELOG.md manually." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$HIGHLIGHTS_STACKED" = "true" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Warning**: \`[Unreleased]\` names two upstream versions. Collapse the Highlights lines before releasing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Up to Date" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current version **${CURRENT_VERSION}** is the latest." >> "$GITHUB_STEP_SUMMARY"
          fi

  # openmls/openmls's own published advisories, held against the crates
  # rust/Cargo.lock resolves — see `make check-upstream-advisories`. A job of
  # its own, so a finding never stops the update pull request above, which is
  # often the fix, and the red run is the notification. It fails as well when
  # the advisories could not be fetched: a check that quietly stopped working
  # would otherwise look exactly like a clean one.
  upstream-advisories:
    name: Upstream security advisories
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      # The token is for quota, not access: the advisories are public, and an
      # anonymous call shares 60 an hour with every job on the runner's address.
      - name: Check the locked upstream crates against their advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make check-upstream-advisories ARGS="--ci"
