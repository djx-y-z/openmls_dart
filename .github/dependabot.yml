# Keeps GitHub Actions pins current. Third-party actions are pinned to commit
# SHAs with a `# vX.Y.Z` comment (see SECURITY.md); Dependabot bumps both the
# SHA and the comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only scans .github/workflows/; the composite actions each live in
    # their own directory, so they are matched explicitly via the glob.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      # Monday 06:00 UTC — before the daily update checks (09:00/10:00 UTC)
      # and after the weekly fuzz run (Monday 04:00 UTC).
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for all action bumps (grouping spans all `directories` above).
      github-actions:
        patterns:
          - "*"
    ignore:
      # dtolnay/rust-toolchain has no versioned releases — it is pinned to a
      # master SHA and the toolchain is selected via the `toolchain:` input.
      # Bumped manually during security backports.
      - dependency-name: "dtolnay/rust-toolchain"

      # TEMPORARY, and the condition for removing it is precise: setup-dart
      # 1.8.0 added a problem matcher for `dart analyze` and registers it with
      # `::add-matcher::dart-analyzer.json`. That path resolves against the
      # *calling* action's directory, and this repository calls setup-dart from
      # inside its own composite action, so the runner looks for the file in
      # .github/actions/setup-fvm/ and fails the job 14 seconds in, before
      # anything is built:
      #
      #   ##[error]Could not find file '.../setup-fvm/dart-analyzer.json'
      #
      # Only the 1.8 line is ignored, so 1.9.0 arrives for evaluation rather
      # than this freezing the action. Delete this entry once a release fixes
      # the path; 1.8.1 (the latest at the time of writing) does not.
      #
      # Worth knowing what the bump is actually worth here: setup-dart exists
      # in this action only to provide a `dart` binary for the next line,
      # `dart pub global activate fvm`. Everything that builds and tests the
      # project comes from the FVM-pinned SDK, so this bump changes no version
      # that reaches the code.
      - dependency-name: "dart-lang/setup-dart"
        versions:
          - "1.8.x"

  # The published package's own constraints — the ones that reach a consumer's
  # resolver. Watching them is the lesson of a real incident: a caret on
  # `flutter_rust_bridge` let a new minor into the published archive with nobody
  # deciding anything, and no ecosystem here was watched, so there was no pull
  # request to review either. The constraint is exact now, which stops the
  # silent half; this is the half that says a new version exists.
  #
  # Only the package root. example/, example_cli/ and rust/fuzz/ are not
  # published and their drift cannot reach a consumer, while each extra
  # directory multiplies the weekly pull requests against a repository whose
  # four-platform matrix is the scarce resource.
  - package-ecosystem: "pub"
    directory: "/"
    # Without this, pub's default strategy is `widen` — "extend only the upper
    # bound to include the new version" — and it applies that across the whole
    # manifest, not only to what it is updating. Measured on the first run: a
    # pull request updating four other packages also rewrote
    # `flutter_rust_bridge: ">=X.Y.Z <X.Y.Z+1"` to a caret, which is the exact
    # constraint that must not float, and widened `lints`, `ffigen` and `hooks`
    # past bounds set on purpose. `ignore` does not protect against this: it
    # stops Dependabot opening a pull request *for* a dependency, not editing
    # that dependency's constraint while it edits the file for other reasons.
    # `increase-if-necessary` leaves a constraint alone when it already admits
    # the new version, so an untouched dependency stays untouched.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch only. A major is a migration, not a bump, and grouping
      # one with everything else blocks the rest: the first run here offered
      # `ffigen` 20 -> 21 and `hooks` 1 -> 2 alongside two harmless minors, and
      # one unmergeable entry takes the whole pull request down. Majors still
      # arrive, one pull request each, where they can be judged on their own.
      pub:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Not a one-file bump, so a pull request that edits one file is wrong by
      # construction. The version has to move in four places at once — this
      # constraint, `frb_version` in .copier-answers.yml, FRB_CODEGEN_VERSION
      # in the Makefile and the `=` pin in rust/Cargo.toml — and the bindings
      # in lib/src/rust/ have to be regenerated by that exact codegen, because
      # the runtime asserts its own version equals the one recorded in them.
      # `make setup-frb-codegen` + `make codegen` is the procedure.
      - dependency-name: "flutter_rust_bridge"

      # hooks 2.x and code_assets 2.x are blocked by the pinned Flutter SDK, not
      # by this repository's code. `hook/build.dart` needs a zero-line diff: it
      # uses only `build()`, `BuildInput` and `BuildOutputBuilder`, and hooks
      # 2.0.0's one breaking change (`ProtocolExtension` from interface to base
      # class) touches none of them.
      #
      # It is a resolver failure. hooks >= 2.1.0 pulls `record_use ^1.0.0`,
      # which needs `meta ^1.19.0`, and Flutter 3.38.4 pins `meta: 1.17.0`
      # exactly (packages/flutter/pubspec.yaml). The first stable release to
      # relax that to `meta: ^1.18.3` is 3.47.0.
      #
      # The reason to ignore rather than merge and fix is that the damage is not
      # ours: the root package resolves fine because it has no `flutter: sdk`
      # dependency, so this breaks `example/` and every Flutter *consumer* on an
      # SDK that pins meta below 1.19.0 — anyone on 3.44.x or earlier — while
      # our own CI would look merely red. code_assets 2.0.0 requires
      # hooks ^2.2.0, so the two only move together and ignoring one without the
      # other just changes which pull request arrives.
      #
      # Lift both when .fvmrc moves to Flutter >= 3.47.0. The constraints in
      # pubspec.yaml already say the same thing ("Majors (hooks 2.x,
      # code_assets 2.x) are a deliberate migration, not a bump"); this is what
      # stops Dependabot proposing that migration once a week in the meantime.
      - dependency-name: "hooks"
        versions:
          - "2.x"
      - dependency-name: "code_assets"
        versions:
          - "2.x"

  # The native crate's dependencies. These are compiled into the binary the
  # build hook downloads, so a vulnerable transitive crate reaches consumers as
  # shipped code rather than as a build-time inconvenience — `make rust-audit`
  # already fails on one, and this is how the fix arrives.
  #
  # The upstream crates are ignored rather than left to chance. They are git
  # dependencies pinned to a tag, and Dependabot's cargo updater does follow git
  # refs — so without this it would open its own pull request for the same bump
  # that check-openmls-updates.yml exists to make, with none of the
  # work that one does: no `make codegen`, no bindings tripwire, no CHANGELOG
  # entry, no version badge. Two pull requests for one upstream release, and the
  # cheaper one merges first.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch only, and it separates more than that name suggests.
      # Dependabot's commit trailers call a 0.x bump `semver-minor` — `rand`
      # 0.9 -> 0.10 and `rusqlite` 0.34 -> 0.40 both say so — but its *grouping*
      # applies Cargo's own reading, where a 0.x minor is the breaking bump,
      # and keeps them out of a minor+patch group anyway. Measured on the first
      # run after this landed: a six-crate group became a group of two (`log`
      # patch, `uuid` 1.x minor) plus one pull request each for `rand`, `sha2`,
      # `hkdf` and `aes-gcm-siv`. Read the version string, not the trailer.
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Same coordinated bump as the pub entry above — see the note there.
      - dependency-name: "flutter_rust_bridge"
      - dependency-name: "openmls"
      - dependency-name: "openmls_rust_crypto"
      - dependency-name: "openmls_basic_credential"
      - dependency-name: "openmls_traits"
      - dependency-name: "openmls_libcrux_crypto"

      # rusqlite has a ceiling of 0.37, for two independent reasons.
      #
      # It is pinned, not chosen: openmls 0.9.0 pulls optional
      # `openmls_sqlite_storage`, which requires `rusqlite = "0.37"` ->
      # `libsqlite3-sys ^0.35`. Cargo resolves optional dependencies into the
      # lockfile even when the feature is off, and `links = "sqlite3"` admits
      # exactly one package — so 0.38+ does not resolve at all while we are on
      # openmls 0.9.0.
      #
      # And 0.40.x is independently unshippable: it bundles SQLCipher 4.14.0,
      # whose `sqlcipher_fprintf` (new in 4.11.0) allocates on Windows. With
      # `PRAGMA cipher_memory_security = ON` every allocation calls
      # `sqlcipher_mlock`; when `VirtualLock` fails on a CI runner
      # (`1453 ERROR_NO_SYSTEM_RESOURCES`) it logs a warning, which allocates,
      # which recurses — ~8 KB of stack per level until the 1 MB Windows stack
      # is gone. The job dies with `-1073741571` (`0xC00000FD`,
      # STATUS_STACK_OVERFLOW). Not a flake: pull requests #19 and #21 both
      # died that way. Fixed upstream in SQLCipher 4.18.0 (affected 4.11-4.15).
      #
      # Our 4.6.1 has no `sqlcipher_fprintf` at all, which is why main logs that
      # same warning 26,150 times and still passes.
      #
      # Lift this when openmls moves off `rusqlite = "0.37"` AND the bundled
      # SQLCipher is >= 4.18.0. Check with:
      #   grep -c sqlcipher_fprintf ~/.cargo/registry/src/*/libsqlite3-sys-<v>/sqlcipher/sqlite3.c
      - dependency-name: "rusqlite"
        versions:
          - ">=0.38"
